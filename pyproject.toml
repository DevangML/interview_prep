[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-system"
version = "1.0.0"
description = "HD-OKF AI Interview Preparation System"
authors = [
    { name = "Technical Engineering Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
