# Card-free configuration: free Render web service + an external free Postgres
# (Neon). Render's own free Postgres is deleted after 30 days, which is exactly
# the data loss this migration exists to prevent — so the database lives
# elsewhere and DATABASE_URL is set by hand.
#
# To move the database onto Render later, see docs/DEPLOYMENT.md.
services:
  - type: web
    name: react-prep-wizard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Paste the Neon (or Supabase) connection string in the Render dashboard.
      # `postgres://` and `postgresql://` forms are both normalised by config.py.
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The free instance has 512 MB RAM; one worker leaves room for the app.
      - key: WEB_CONCURRENCY
        value: "1"
