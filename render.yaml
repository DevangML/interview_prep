databases:
  - name: react-prep-db
    databaseName: reactprep
    user: reactprep
    # Starter or above: the free Postgres tier is deleted after 30 days and has
    # no automated backups, which defeats the point of this migration.
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: react-prep-wizard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: react-prep-db
          property: connectionString
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
