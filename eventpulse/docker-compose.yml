name: eventpulse-lab

services:
  postgres:
    image: eventpulse-postgres:lab
    build: ./sql
    environment:
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${EVENTPULSE_DB_PASSWORD:-eventpulse-local-only}
      POSTGRES_DB: eventpulse
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse -d eventpulse"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka-volume-init:
    image: apache/kafka:4.1.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]

  kafka:
    image: apache/kafka:4.1.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  topic-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in telemetry-raw telemetry-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=604800000
        done

  api:
    profiles: [apps]
    build: ./java-producer
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventpulse
      SPRING_DATASOURCE_USERNAME: eventpulse
      SPRING_DATASOURCE_PASSWORD: ${EVENTPULSE_DB_PASSWORD:-eventpulse-local-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTPULSE_API_TOKEN: ${EVENTPULSE_API_TOKEN:-change-me-local-only}
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      topic-init: {condition: service_completed_successfully}

  worker:
    profiles: [apps]
    build: ./python-consumer
    environment:
      DATABASE_URL: postgresql://eventpulse:${EVENTPULSE_DB_PASSWORD:-eventpulse-local-only}@postgres:5432/eventpulse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: eventpulse-worker
    depends_on:
      postgres: {condition: service_healthy}
      topic-init: {condition: service_completed_successfully}

volumes:
  pg-data:
  kafka-data:
