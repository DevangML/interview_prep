<!DOCTYPE html>
<html>
<body>
  <div id="status">Testing...</div>
  <pre id="log"></pre>
  <script>
    function camel(prop) {
      return prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    }

    const ALWAYS_COMPARED = [
      'display', 'position', 'flex-direction', 'flex-wrap',
      'justify-content', 'align-items', 'align-content',
      'grid-template-columns', 'grid-template-rows', 'grid-template-areas',
      'align-items', 'justify-content', 'gap', 'box-sizing',
    ];
    const HARD = '*,*::before,*::after{box-sizing:border-box}body{margin:0;padding:10px;font:14px system-ui}';
    const baseHtml = `
    <div class="row">
      <h2 class="title">A headline far too long to fit in this row</h2>
      <button class="act">action</button>
    </div>`;

    const refCss = `.row { display: flex; gap: 1rem; align-items: center; width: 22rem; }
.act { flex: none; }

.title {
  white-space: nowrap;
    min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}`;

    const usrCss = `.row { display: flex; gap: 1rem; align-items: center; width: 22rem; }
.act { flex: none; }

.title {
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}`;

    function srcdoc(css) {
      return `<!doctype html><html><head><meta charset="utf-8">
<style>${HARD}</style><style>${css}</style>
</head><body><div id="root"></div><script>
document.getElementById('root').innerHTML = ${JSON.stringify(baseHtml)};
<\/script></body></html>`;
    }

    function mount(html) {
      return new Promise(r => {
        const f = document.createElement('iframe');
        f.style.cssText = 'position:fixed;left:-10000px;top:0;width:1100px;height:600px;visibility:hidden;';
        f.srcdoc = html;
        document.body.appendChild(f);
        
        // Wait for it to be ready
        const tick = () => {
          const doc = f.contentDocument;
          const root = doc && doc.getElementById('root');
          if (root && root.children.length > 0) { r(f); return; }
          setTimeout(tick, 8);
        };
        tick();
      });
    }

    async function run() {
      try {
        const rf = await mount(srcdoc(refCss));
        const uf = await mount(srcdoc(usrCss));

        const rd = rf.contentDocument;
        const ud = uf.contentDocument;
        
        let errs = [];
        const rEls = Array.from(rd.getElementById('root').querySelectorAll('*'));
        const uEls = Array.from(ud.getElementById('root').querySelectorAll('*'));
        
        const props = ['min-width', 'text-overflow', 'overflow'];

        for(let i=0; i<rEls.length; i++) {
          const r = rEls[i];
          const u = uEls[i];
          
          const rr = r.getBoundingClientRect();
          const ur = u.getBoundingClientRect();
          
          for(const d of ['width','height','x','y']) {
            if(Math.abs(rr[d] - ur[d]) > 1) {
                errs.push(`Geo ${r.tagName} ${d}: ref=${rr[d]} usr=${ur[d]}`);
            }
          }
          const rcs = rd.defaultView.getComputedStyle(r);
          const ucs = ud.defaultView.getComputedStyle(u);
          
          for(const p of [...props, ...ALWAYS_COMPARED]) {
            const k = camel(p);
            if(rcs[k] !== ucs[k]) errs.push(`Style ${r.tagName} ${p}: ref=${rcs[k]} usr=${ucs[k]}`);
          }
        }
        
        document.getElementById('log').innerText = errs.join('\n');
        document.getElementById('status').innerText = errs.length ? 'FAIL' : 'PASS';
      } catch (e) {
        document.getElementById('status').innerText = e.message;
      }
    }
    run();
  </script>
</body>
</html>
