<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge Arena</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,sans-serif;color:black;background:whitesmoke;display:flex;flex-direction:column}
.top{background:#0f172a;color:white;padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.top h1{margin:0;font-size:.95rem;flex:1}
.tb,.vp button{border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:.3rem .7rem;border-radius:.375rem;font:600 .75rem system-ui;cursor:pointer;transition:background-color 150ms ease}
.tb:hover,.vp button:hover{background:#334155}
.vp{display:flex;gap:.25rem}.vp button[aria-pressed=true]{background:steelblue;border-color:steelblue;color:white}
main{flex:1;display:grid;grid-template-columns:17rem 1fr 1fr;gap:.6rem;padding:.6rem;min-height:0}
@media(max-width:1100px){main{grid-template-columns:1fr 1fr}#list{grid-column:1/-1;max-height:9rem}}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}}
.panel{background:white;border:1px solid gainsboro;border-radius:.625rem;overflow:auto;min-height:0;display:flex;flex-direction:column}
.ph{padding:.55rem .8rem;border-bottom:1px solid gainsboro;font:700 .68rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;display:flex;align-items:center;gap:.5rem;position:sticky;top:0;background:snow;z-index:2}
.ph .sp{flex:1}
.mini{border:1px solid silver;background:white;border-radius:.3rem;font:600 .68rem system-ui;padding:.15rem .5rem;cursor:pointer;color:dimgray;text-transform:none;letter-spacing:0}
.mini:hover{background:whitesmoke}
.pb{padding:.8rem;flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.item{padding:.55rem .8rem;border-bottom:1px solid #f1f5f9;cursor:pointer}
.item:hover{background:#f8fafc}
.item[aria-current=true]{background:aliceblue;box-shadow:inset .2rem 0 0 steelblue}
.item b{display:block;font-size:.9rem}
.item span{font-size:.72rem;color:dimgray}
.lvl{display:inline-block;font:700 .6rem system-ui;padding:.05rem .4rem;border-radius:999px;background:#eef2ff;color:#3730a3;margin-right:.3rem}
h2{margin:0 0 .3rem;font-size:1.05rem}
.brief{margin:0;color:#334155;font-size:.9rem;max-width:60ch}
.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3rem}
.req li{display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;color:#334155}
.req input{margin-top:.2rem;accent-color:seagreen}
.hint{border:1px solid gainsboro;border-radius:.5rem;overflow:hidden}
.hint button{width:100%;text-align:left;background:snow;border:0;padding:.5rem .7rem;font:600 .82rem system-ui;cursor:pointer;color:steelblue}
.hint button:hover{background:aliceblue}
.hint p{margin:0;padding:.6rem .7rem;border-top:1px solid gainsboro;font-size:.85rem;color:#334155;background:white;display:none}
.hint.open p{display:block}
.hint.open button{color:dimgray}
textarea{flex:1;width:100%;font:13px/1.6 ui-monospace,Menlo,monospace;padding:.7rem;border:1px solid silver;border-radius:.5rem;resize:none;background:white;tab-size:2;min-height:0}
textarea:focus-visible{outline:2px solid steelblue;outline-offset:1px}
iframe{border:0;background:white;width:100%;flex:1;min-height:0}
.stage{flex:1;border:1px solid silver;border-radius:.5rem;background:white;display:flex;min-height:0;overflow:auto}
.err{background:#fee2e2;color:#7f1d1d;border:1px solid lightcoral;border-radius:.5rem;padding:.5rem .7rem;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;display:none;max-height:7rem;overflow:auto}
.err.show{display:block}
.tags{display:flex;gap:.3rem;flex-wrap:wrap}
.tag{font:600 .68rem system-ui;background:aliceblue;color:steelblue;padding:.1rem .5rem;border-radius:999px}
.ok{font:600 .7rem system-ui;color:seagreen}

.kn{border:1px solid gainsboro;border-radius:.5rem;background:snow;margin-top:.5rem;overflow:hidden;flex:none}
.kn-hd{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:#f8fafc;border-bottom:1px solid gainsboro;font:700 .64rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;cursor:pointer;user-select:none;margin:0}
.kn-hd .sp{flex:1}
.kn-body{padding:.45rem .6rem;display:grid;gap:.3rem;max-height:11rem;overflow:auto}
.kn.closed .kn-body{display:none}
.kn-row{display:grid;grid-template-columns:8rem 1fr 4.2rem;gap:.5rem;align-items:center}
.kn-lab{font:600 .72rem ui-monospace,monospace;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn-val{font:600 .7rem ui-monospace,monospace;color:steelblue;text-align:right;white-space:nowrap}
.kn-rng{width:100%;accent-color:steelblue;height:1.1rem}
.kn-sel,.kn-txt{width:100%;font-size:.75rem;padding:.15rem .3rem;border:1px solid silver;border-radius:.25rem;background:white}
.kn-col{width:100%;height:1.4rem;padding:0;border:1px solid silver;border-radius:.25rem;background:white;cursor:pointer}
.kn-empty{margin:0;font:.75rem system-ui;color:dimgray}
</style><script src="vendor/prettier-standalone.js"></script><script src="vendor/prettier-babel.js"></script><script src="vendor/prettier-estree.js"></script><script src="vendor/prettier-postcss.js"></script><script src="fmt.js?v=1787474763"></script><script src="preview.js?v=1787479426"></script><script src="inspect.js?v=1787404142"></script><script src="viewport.js?v=1787479101"></script><script src="ux.js?v=1787480828"></script><link rel="stylesheet" href="vendor/cm.css"><link rel="stylesheet" href="editor.css?v=1787479467"><script src="vendor/cm.js"></script><script src="vendor/cm-css.js"></script><script src="vendor/cm-xml.js"></script><script src="vendor/cm-js.js"></script><script src="vendor/cm-jsx.js"></script><script src="vendor/cm-closeb.js"></script><script src="vendor/cm-closetag.js"></script><script src="vendor/cm-matchb.js"></script><script src="vendor/cm-activeline.js"></script><script src="vendor/cm-comment.js"></script><script src="editor.js?v=1787480828"></script><script src="vendor/split.js"></script><link rel="stylesheet" href="files.css?v=1787475474"><script src="files.js?v=1787478830"></script><link rel="stylesheet" href="theme.css?v=1787480460"><script src="sheets.js?v=1787478976"></script><script src="migrate.js?v=1787480957"></script><script src="compile.js?v=1787484808"></script><script src="cssmodel.js?v=1787478700"></script><script src="direct.js?v=1787479101"></script><script src="inspector.js?v=1787478976"></script><link rel="stylesheet" href="shell.css?v=1787478912"><script src="panes.js?v=1787479101"></script><script src="tip.js?v=1787479075"></script></head>
<body>
<div class="top"><h1>Challenge Arena <span style="color:#94a3b8;font-weight:400">— real React, hints on demand, live result</span></h1>
<span class="ok" id="stat">ready</span>
<button class="tb" id="reset">Reset code</button><button class="tb" id="sol">Show solution</button></div>
<main>
  <div class="panel" id="list"><p class="ph">Challenges</p><div id="items"></div></div>
  <div class="panel"><p class="ph">The brief<span class="sp"></span><span class="mini" id="time"></span></p>
    <div class="pb" id="brief"></div></div>
  <div class="panel"><p class="ph">Your code<span class="sp"></span><button class="mini" id="fmtcode" style="cursor:pointer">format</button><span class="mini" id="hintstat"></span></p>
    <div class="pb"><div class="ed"><textarea id="code" data-mode="jsx" spellcheck="false"></textarea></div><div class="ed"><textarea id="appcss" data-mode="css" spellcheck="false"></textarea></div>
      <div class="stage"><iframe id="out" title="result"></iframe></div>
      <pre class="err" id="err"></pre></div></div>
</main>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="challenges.js?v=1787479393"></script>
<script src="ch.js?v=1787479426"></script>
<script src="nav.js?v=1787478081"></script>
</body></html>
