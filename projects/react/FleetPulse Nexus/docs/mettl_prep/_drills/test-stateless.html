<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="vendor/cm.css">
  <script src="vendor/cm.js"></script>
<script src="vendor/emmet.js"></script>
  <script src="vendor/cm-xml.js"></script>
  <script src="vendor/cm-js.js"></script>
  <script src="vendor/cm-jsx.js"></script>
</head>
<body>
  <div id="ed"></div>
  <script>
    CodeMirror.defineMode("rainbow-indents", function(config) {
      var indentUnit = config.indentUnit || 2;
      var colors = ['rainbow-1', 'rainbow-2', 'rainbow-3'];
      return {
        token: function(stream) {
          var isLeadingSpace = /^\s*$/.test(stream.string.slice(0, stream.pos));
          if (isLeadingSpace) {
            if (stream.eat(' ')) {
              var spacesEaten = 1;
              while (spacesEaten < indentUnit && stream.eat(' ')) {
                spacesEaten++;
              }
              var blockIndex = Math.floor((stream.pos - 1) / indentUnit);
              return colors[blockIndex % colors.length];
            }
            if (stream.eat('\t')) {
              var blockIndex = stream.pos - 1;
              return colors[blockIndex % colors.length];
            }
          }
          stream.skipToEnd();
          return null;
        }
      };
    });
    var cm = CodeMirror(document.getElementById('ed'), {
      value: "function foo() {\n  if (true) {\n    return 1;\n  }\n}",
      mode: "jsx"
    });
    cm.addOverlay("rainbow-indents");
    console.log("No error!");
    document.body.innerHTML += "<div id='res'>No error!</div>";
  </script>
</body>
</html>
