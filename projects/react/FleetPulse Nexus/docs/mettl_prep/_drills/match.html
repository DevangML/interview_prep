.frames{display:grid;gap:.5rem;grid-template-columns:1fr 1fr}
.frame{border:1px solid gainsboro;border-radius:.5rem;overflow:hidden;background:white}
.frame p{margin:0;padding:.25rem .5rem;font:700 .6rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;background:#f8fafc;border-bottom:1px solid gainsboro}
.frame .box{display:grid;place-items:center;padding:.4rem}
textarea{flex:1;width:100%;font:13px/1.6 ui-monospace,Menlo,monospace;padding:.7rem;border:1px solid silver;border-radius:.5rem;resize:vertical;background:white;tab-size:2;min-height:0}

.teach{margin:0;font-size:.88rem;color:#334155}
.hint{border:1px solid gainsboro;border-radius:.5rem;overflow:hidden}

.hint.open p{display:block}
canvas{display:block;max-width:100%;image-rendering:pixelated}
.diffwrap{border:1px solid gainsboro;border-radius:.5rem;overflow:hidden}
.diffwrap p{margin:0;padding:.25rem .5rem;font:700 .6rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;background:#f8fafc;border-bottom:1px solid gainsboro}
.win{background:seagreen;color:white;padding:.5rem .8rem;border-radius:.5rem;font:700 .85rem system-ui;text-align:center;display:none}
.win.show{display:block;animation:pop 240ms ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
