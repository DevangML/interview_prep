<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Arena</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,sans-serif;color:black;background:whitesmoke;display:flex;flex-direction:column}
.top{background:#0f172a;color:white;padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.top h1{margin:0;font-size:.95rem}
.bar{flex:1;display:flex;align-items:center;gap:.6rem;min-width:12rem}
.xp{flex:1;max-width:16rem;height:.4rem;background:#334155;border-radius:999px;overflow:hidden}
.xp i{display:block;height:100%;background:steelblue;width:0;transition:width .3s}
.rank{font:700 .72rem system-ui;color:goldenrod}
.tb,.vp button{border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:.3rem .7rem;border-radius:.375rem;font:600 .75rem system-ui;cursor:pointer}
.tb:hover,.vp button:hover{background:#334155}
.vp{display:flex;gap:.25rem}.vp button[aria-pressed=true]{background:steelblue;border-color:steelblue;color:white}
main{flex:1;display:grid;grid-template-columns:18rem 1fr 1fr;gap:.6rem;padding:.6rem;min-height:0}
@media(max-width:1100px){main{grid-template-columns:1fr 1fr}#list{grid-column:1/-1;max-height:11rem}}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}}
.panel{background:white;border:1px solid gainsboro;border-radius:.625rem;overflow:auto;min-height:0;display:flex;flex-direction:column}
.ph{margin:0;padding:.55rem .8rem;border-bottom:1px solid gainsboro;font:700 .68rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;display:flex;gap:.5rem;align-items:center;position:sticky;top:0;background:snow;z-index:2}
.ph .sp{flex:1}
.mini{border:1px solid silver;background:white;border-radius:.3rem;font:600 .68rem system-ui;padding:.15rem .5rem;color:dimgray;text-transform:none;letter-spacing:0}
.pb{padding:.8rem;flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.qh{padding:.45rem .8rem;background:#f8fafc;border-bottom:1px solid gainsboro;font:700 .7rem system-ui;color:#334155;display:flex;gap:.4rem;align-items:center}
.item{padding:.5rem .8rem;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;gap:.5rem;align-items:flex-start}
.item:hover{background:#f8fafc}
.item[aria-current=true]{background:aliceblue;box-shadow:inset .2rem 0 0 steelblue}
.item.locked{opacity:.45;cursor:not-allowed}
.item.done b{text-decoration:line-through;color:dimgray}
.item b{display:block;font-size:.82rem;font-weight:600}
.item small{color:dimgray;font-size:.7rem}
.ic{flex:none;width:1.1rem}
h2{margin:0 0 .3rem;font-size:1.02rem}
.brief{margin:0;color:#334155;font-size:.88rem;max-width:60ch}
.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3rem}
.req li{display:flex;gap:.5rem;align-items:flex-start;font-size:.84rem;color:#334155}
.req input{margin-top:.2rem;accent-color:seagreen}
.hint{border:1px solid gainsboro;border-radius:.5rem;overflow:hidden}
.hint button{width:100%;text-align:left;background:snow;border:0;padding:.45rem .7rem;font:600 .8rem system-ui;cursor:pointer;color:steelblue}
.hint p{margin:0;padding:.55rem .7rem;border-top:1px solid gainsboro;font-size:.83rem;color:#334155;display:none}
.hint.open p{display:block}.hint.open button{color:dimgray}
textarea{flex:1;width:100%;font:13px/1.6 ui-monospace,Menlo,monospace;padding:.7rem;border:1px solid silver;border-radius:.5rem;resize:none;background:white;tab-size:2;min-height:0}
textarea:focus-visible{outline:2px solid steelblue;outline-offset:1px}
iframe{border:0;background:white;width:100%;flex:1;min-height:0}
.stage{flex:1;border:1px solid silver;border-radius:.5rem;background:white;display:flex;min-height:0;overflow:auto}
.err{background:#fee2e2;color:#7f1d1d;border:1px solid lightcoral;border-radius:.5rem;padding:.5rem .7rem;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;display:none;max-height:7rem;overflow:auto}
.err.show{display:block}
.lockmsg{padding:1rem;color:dimgray;font-size:.88rem}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.b{padding:.4rem .8rem;border-radius:.375rem;border:1px solid silver;background:white;font:600 .8rem system-ui;cursor:pointer}
.b.p{background:steelblue;border-color:steelblue;color:white}
.b.g{background:seagreen;border-color:seagreen;color:white}
.b:focus-visible{outline:2px solid steelblue;outline-offset:2px}
.ok{font:600 .7rem system-ui;color:seagreen}

.kn{border:1px solid gainsboro;border-radius:.5rem;background:snow;margin-top:.5rem;overflow:hidden;flex:none}
.kn-hd{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:#f8fafc;border-bottom:1px solid gainsboro;font:700 .64rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;cursor:pointer;user-select:none;margin:0}
.kn-hd .sp{flex:1}
.kn-body{padding:.45rem .6rem;display:grid;gap:.3rem;max-height:11rem;overflow:auto}
.kn.closed .kn-body{display:none}
.kn-row{display:grid;grid-template-columns:8rem 1fr 4.2rem;gap:.5rem;align-items:center}
.kn-lab{font:600 .72rem ui-monospace,monospace;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn-val{font:600 .7rem ui-monospace,monospace;color:steelblue;text-align:right;white-space:nowrap}
.kn-rng{width:100%;accent-color:steelblue;height:1.1rem}
.kn-sel,.kn-txt{width:100%;font-size:.75rem;padding:.15rem .3rem;border:1px solid silver;border-radius:.25rem;background:white}
.kn-col{width:100%;height:1.4rem;padding:0;border:1px solid silver;border-radius:.25rem;background:white;cursor:pointer}
.kn-empty{margin:0;font:.75rem system-ui;color:dimgray}
</style><script src="vendor/prettier-standalone.js"></script><script src="vendor/prettier-babel.js"></script><script src="vendor/prettier-estree.js"></script><script src="vendor/prettier-postcss.js"></script><script src="fmt.js?v=1787474763"></script><script src="preview.js?v=1787479426"></script><script src="inspect.js?v=1787404142"></script><script src="viewport.js?v=1787479101"></script><script src="ux.js?v=1787480828"></script><link rel="stylesheet" href="vendor/cm.css"><link rel="stylesheet" href="editor.css?v=1787479467"><script src="vendor/cm.js"></script><script src="vendor/cm-css.js"></script><script src="vendor/cm-xml.js"></script><script src="vendor/cm-js.js"></script><script src="vendor/cm-jsx.js"></script><script src="vendor/cm-closeb.js"></script><script src="vendor/cm-closetag.js"></script><script src="vendor/cm-matchb.js"></script><script src="vendor/cm-activeline.js"></script><script src="vendor/cm-comment.js"></script><script src="editor.js?v=1787480828"></script><script src="vendor/split.js"></script><link rel="stylesheet" href="files.css?v=1787475474"><script src="files.js?v=1787478830"></script><link rel="stylesheet" href="theme.css?v=1787480460"><script src="sheets.js?v=1787478976"></script><script src="migrate.js?v=1787480957"></script><script src="compile.js?v=1787484808"></script><script src="cssmodel.js?v=1787478700"></script><script src="direct.js?v=1787479101"></script><script src="inspector.js?v=1787478976"></script><link rel="stylesheet" href="shell.css?v=1787478912"><script src="panes.js?v=1787479101"></script><script src="tip.js?v=1787479075"></script></head><body>
<div class="top"><h1>Campaign Arena</h1>
 <div class="bar"><span class="rank" id="rank">—</span><span class="xp"><i id="xpbar"></i></span><span class="mini" id="xptxt" style="color:#94a3b8;border:0;background:none"></span></div>
 <span class="ok" id="stat">ready</span>
 <button class="tb" id="reset">Reset</button></div>
<main>
 <div class="panel" id="list"><p class="ph">Campaign challenges<span class="sp"></span><span class="mini" id="cnt"></span></p><div id="items"></div></div>
 <div class="panel"><p class="ph">The task<span class="sp"></span><span class="mini" id="hintstat"></span></p><div class="pb" id="brief"></div></div>
 <div class="panel"><p class="ph">Your code<span class="sp"></span><button class="mini" id="fmtcode" style="cursor:pointer">format</button><button class="mini" id="mark" style="cursor:pointer">Mark done ✓</button></p>
  <div class="pb"><div class="ed"><textarea id="code" data-mode="jsx" spellcheck="false"></textarea></div><div class="ed"><textarea id="appcss" data-mode="css" spellcheck="false"></textarea></div>
   <div class="stage"><iframe id="out" title="result"></iframe></div><pre class="err" id="err"></pre></div></div>
</main>
<script src="vendor/react.js"></script><script src="vendor/react-dom.js"></script><script src="vendor/babel.min.js"></script>
<script>
const $=s=>document.querySelector(s); let ST=null, cur=null, curQ=null, APP='';
const OPEN=new Set(['UNLOCKED','IN_PROGRESS','CHALLENGES_DONE','CLEARED']);
const log=(ev,extra={})=>fetch('/api/activity',{method:'POST',body:JSON.stringify({ev,page:'arena',...extra})}).catch(()=>{});

if(typeof VIEWPORT!=='undefined') VIEWPORT.mount($('#out'));
Promise.all([fetch('app.css').then(r=>r.text()).catch(()=>''),fetch('/api/state').then(r=>r.json())])
 .then(([css,st])=>{APP=css;ST=st;
   var a=$('#appcss'); if(a){ a.value=css;
     SHEETS.register('app.css', a, 'app.css');
     SHEETS.onChange(function(){ clearTimeout(run._t); run._t=setTimeout(run,180); }); }
   if(window.FILES) FILES.auto();
   draw();log('open');});

function progression(){const p=ST.active_campaign.progression;
 $('#rank').textContent=p.rank; $('#xpbar').style.width=(p.xp/p.xp_total*100)+'%';
 $('#xptxt').textContent=p.xp+' / '+p.xp_total+' XP';}

function draw(){
 const qs=ST.active_campaign.quests; let html='', open=0, done=0, locked=0;
 qs.forEach(q=>{
   const play=(q.challenges||[]).filter(c=>c.playable); if(!play.length) return;
   const unlocked=OPEN.has(q.status);
   html+='<div class="qh">'+(unlocked?'🔓':'🔒')+' '+q.id+' · '+q.title+'</div>';
   play.forEach(c=>{
     const d=!!c.done; if(!unlocked)locked++; else {open++; if(d)done++;}
     html+='<div class="item'+(unlocked?'':' locked')+(d?' done':'')+'" data-id="'+c.id+'" data-q="'+q.id+'">'
       +'<span class="ic">'+(!unlocked?'🔒':d?'✅':'⚔️')+'</span>'
       +'<span><b>'+c.name.replace(/^(POLYFILL|S\d+)[:.]?\s*/,'')+'</b>'
       +'<small>'+(c.hints?c.hints.length+' hints · ':'')+(c.est_min||10)+' min</small></span></div>';
   });
 });
 $('#items').innerHTML=html; $('#cnt').textContent=done+' done · '+open+' open · '+locked+' locked';
 document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{
   if(el.classList.contains('locked')){ showLocked(el.dataset.q); return; }
   pick(el.dataset.id,el.dataset.q); });
 progression();
}
function showLocked(qid){
 const q=ST.active_campaign.quests.find(x=>x.id===qid);
 $('#brief').innerHTML='<div class="lockmsg"><h2>🔒 Locked</h2><p class="brief">'+q.title+'</p>'
  +'<p class="brief"><b>Unlocks when:</b> '+(q.unlock_condition||'—')+'</p>'
  +'<p class="brief" style="margin-top:.6rem">'+(q.why||'')+'</p></div>';
 $('#code').value=''; $('#out').srcdoc=''; log('locked_peek',{quest:qid});
}
function pick(id,qid){
 const q=ST.active_campaign.quests.find(x=>x.id===qid);
 const c=q.challenges.find(x=>x.id===id); cur=c; curQ=q;
 document.querySelectorAll('.item').forEach(i=>i.setAttribute('aria-current',i.dataset.id===id));
 const reqs=(c.edge_cases||[]).map((r,i)=>'<li><input type="checkbox" id="r'+i+'"><label for="r'+i+'">'+r+'</label></li>').join('');
 $('#brief').innerHTML='<div><h2>'+c.name+'</h2><p class="brief" style="color:dimgray;font-size:.78rem">'+q.id+' · '+q.title+'</p></div>'
  +(reqs?'<p class="ph" style="padding:0;border:0;background:none;position:static">Must handle</p><ul class="req">'+reqs+'</ul>':'')
  +(c.hints?'<p class="ph" style="padding:0;border:0;background:none;position:static">Hints — open only when stuck</p>'
     +c.hints.map((h,i)=>'<div class="hint"><button type="button" data-h="'+i+'">Hint '+(i+1)+'</button><p>'+h+'</p></div>').join('')
     :'<p class="brief" style="color:dimgray">No hints for this one — it is a drill, not a puzzle.</p>');
 $('#brief').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{
   b.parentElement.classList.toggle('open'); hc(); log('hint',{id:c.id,hint:+b.dataset.h+1});});
 hc();
 $('#code').value = localStorage.getItem('arena:'+c.id) || c.last_code || c.start ||
   "import React from 'react';\n\nexport default function App() {\n  return (\n    <div className=\"box\">Start here</div>\n  );\n}\n";
 run(); log('open_challenge',{id:c.id,quest:q.id});
}
function hc(){const n=$('#brief').querySelectorAll('.hint.open').length;
 $('#hintstat').textContent=n?n+' hint'+(n>1?'s':'')+' used':'no hints used';}
var PV=null;
function run(){
 var r=COMPILE.compile($('#code').value);
 if(r.error){ $('#err').textContent=r.error; $('#err').classList.add('show');
   $('#stat').textContent='error'; $('#stat').style.color='firebrick'; return; }
 var js=r.code;
 $('#err').classList.remove('show'); $('#stat').textContent='running'; $('#stat').style.color='seagreen';
 if(!PV){ PV=new Preview($('#out'),{mode:'react'});
   PV.onerror=function(e){ $('#err').textContent='Runtime — '+e.message; $('#err').classList.add('show');
     $('#stat').textContent='error'; $('#stat').style.color='firebrick'; }; }
 PV.update(SHEETS.text('app.css')+'\nbody{padding:1rem}', '', null, js);
}
addEventListener('message',e=>{if(e.data&&e.data.t==='err'){$('#err').textContent=e.data.m;$('#err').classList.add('show');
 $('#stat').textContent='error';$('#stat').style.color='firebrick';}});
let t;$('#code').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{run();
 if(cur){localStorage.setItem('arena:'+cur.id,$('#code').value); log('edit',{id:cur.id,len:$('#code').value.length});}},300);});
$('#mark').onclick=()=>{
 if(!cur) return;
 const checks=[...$('#brief').querySelectorAll('.req input')].map(i=>i.checked);
 const go=(checks.length && !checks.every(Boolean))
   ? UX.ask('Not every requirement is ticked','Mark this challenge done anyway? Your checks are saved either way.','Mark done')
   : Promise.resolve(true);
 go.then(function(yes){ if(!yes) return;
 fetch('/api/challenge',{method:'POST',body:JSON.stringify({id:cur.id,done:true,code:$('#code').value,
   checks,hints_used:$('#brief').querySelectorAll('.hint.open').length})})
  .then(r=>r.json()).then(r=>{ if(r.error){UX.toast(r.error,'err');return;}
    ST.active_campaign.progression=Object.assign(ST.active_campaign.progression,r.progression);
    cur.done=true; draw(); $('#stat').textContent='saved'; $('#stat').style.color='seagreen';
    UX.toast('Saved to campaign · '+r.progression.xp+' XP','ok'); }); });
};
$('#fmtcode').onclick=()=>{FMT.applyTo($('#code'),'jsx',run);};
$('#reset').onclick=()=>{ if(!cur)return; localStorage.removeItem('arena:'+cur.id); $('#code').value=cur.start||''; run(); };
document.querySelectorAll('.vp button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vp button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 $('#out').style.width=b.dataset.w==='0'?'100%':b.dataset.w+'px';});
addEventListener('beforeunload',()=>navigator.sendBeacon&&navigator.sendBeacon('/api/activity',JSON.stringify({ev:'close',page:'arena'})));
</script><script src="nav.js?v=1787478081"></script>
</body></html>
