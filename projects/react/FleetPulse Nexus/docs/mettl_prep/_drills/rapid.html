<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Fire</title>
<link rel="stylesheet" href="theme.css?v=1787480460"><style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,sans-serif;color:var(--ui-ink);background:var(--ui-bg);
 min-display:flex;flex-direction:column}
.top{background:var(--ui-nav);color:var(--ui-nav-ink);padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;flex:none}
.top h1{margin:0;font-size:.95rem}
.meta{font:700 .75rem ui-monospace,monospace;color:#94a3b8}
.timer{font:800 1rem ui-monospace,monospace;color:var(--ui-warn)}
.streak{font:700 .78rem system-ui;color:var(--ui-ok)}
.tb{border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:.3rem .75rem;border-radius:.375rem;font:600 .75rem system-ui;cursor:pointer}
.tb:hover{background:#334155}
.wrap{flex:1;display:grid;place-items:start center;padding:1.2rem 1rem 3rem;width:100%}
.card{width:min(56rem,100%);background:var(--ui-surface);border:1px solid var(--ui-line);
 border-radius:var(--ui-r-lg);box-shadow:var(--ui-sh-2);padding:1.4rem;display:grid;gap:1rem}
.tag{justify-self:start;font:700 .62rem system-ui;letter-spacing:.07em;text-transform:uppercase;
 background:var(--ui-accent-soft);color:var(--ui-accent);padding:.15rem .55rem;border-radius:999px}
.q{margin:0;font-size:1.06rem;font-weight:600;line-height:1.45}
.q code{font:600 .92em ui-monospace,monospace;background:var(--ui-sunken);padding:.1rem .35rem;border-radius:.25rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;text-align:left;border:1px solid var(--ui-line);
 background:var(--ui-surface);border-radius:.5rem;padding:.65rem .8rem;font:inherit;font-size:.92rem;cursor:pointer;
 transition:border-color var(--ui-t) ease,background-color var(--ui-t) ease}
.opt:hover:not(:disabled){border-color:var(--ui-accent);background:var(--ui-accent-soft)}
.opt .k{font:700 .7rem ui-monospace,monospace;color:var(--ui-muted);flex:none;margin-top:.15rem}
.opt[data-s=right]{border-color:var(--ui-ok);background:color-mix(in srgb,var(--ui-ok) 10%,var(--ui-surface))}
.opt[data-s=wrong]{border-color:var(--ui-danger);background:color-mix(in srgb,var(--ui-danger) 10%,var(--ui-surface))}
.opt:disabled{cursor:default}
.why{margin:0;padding:.75rem .9rem;border-left:3px solid var(--ui-accent);background:var(--ui-accent-soft);
 border-radius:0 .4rem .4rem 0;font-size:.9rem;color:var(--ui-ink2);display:none}
.why.show{display:block}
.why b{color:var(--ui-ink)}
.snip{display:grid;gap:.6rem}
textarea{width:100%;min-height:9rem;font:13px/1.6 ui-monospace,Menlo,monospace;padding:.7rem;
 border:1px solid var(--ui-line2);border-radius:.5rem;background:var(--ui-surface);resize:vertical;tab-size:2}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{padding:.5rem 1rem;border-radius:.45rem;border:1px solid var(--ui-line2);background:var(--ui-surface);
 font:600 .85rem system-ui;cursor:pointer;transition:background-color var(--ui-t) ease}
.btn.p{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-ink)}
.btn:hover{filter:brightness(.97)}
.verdict{font:700 .85rem system-ui}
.verdict[data-v=pass]{color:var(--ui-ok)}.verdict[data-v=fail]{color:var(--ui-danger)}
.done{text-align:center;display:grid;gap:.8rem;justify-items:center}
.big{font:800 2.4rem system-ui;color:var(--ui-accent)}
.missed{width:100%;display:grid;gap:.4rem;text-align:left}
.missed div{font-size:.86rem;color:var(--ui-ink2);border-left:3px solid var(--ui-danger);padding-left:.6rem}
.bar{height:.35rem;background:var(--ui-line);border-radius:99px;overflow:hidden;width:min(56rem,100%);margin:0 auto .9rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ui-accent),#7dd3fc);transition:width .25s}
</style><link rel="stylesheet" href="shell.css?v=1787478912"><script src="panes.js?v=1787479101"></script><script src="tip.js?v=1787479075"></script></head><body class="doc">
<div class="top"><h1>Rapid Fire <span style="color:#94a3b8;font-weight:400">— the subtle parts, under time</span></h1>
 <span style="flex:1"></span>
 <span class="streak" id="streak"></span><span class="meta" id="meta"></span><span class="timer" id="timer"></span>
 <button class="tb" id="restart">Restart</button></div>
<div class="wrap"><div style="width:min(56rem,100%)"><div class="bar"><i id="prog"></i></div>
 <div class="card" id="card"></div></div></div>
<script src="rapid-items.js?v=1787478004"></script><script src="rapid.js?v=1787478081"></script><script src="nav.js?v=1787478081"></script>
</body></html>
