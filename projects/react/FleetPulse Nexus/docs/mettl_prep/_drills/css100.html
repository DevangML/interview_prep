<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 100</title>
<link rel="stylesheet" href="theme.css?v=1787480460">
<link rel="stylesheet" href="shell.css?v=1787478912">
<link rel="stylesheet" href="dia.css?v=1787560026">
<link rel="stylesheet" href="vendor/cm.css">
<link rel="stylesheet" href="editor.css?v=1787479467">
<style>
body{margin:0;font:15px/1.55 system-ui,sans-serif;color:black;background:whitesmoke;display:flex;flex-direction:column}
.top{background:#0f172a;color:white;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.top h1{margin:0;font-size:.95rem}
.top select{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:.375rem;padding:.3rem .5rem;font:600 .75rem system-ui}
.prog{flex:1;min-width:8rem;height:.45rem;background:#1e293b;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:seagreen;width:0;transition:width 200ms ease}
#cnt{font:600 .72rem ui-monospace,monospace;color:#94a3b8}
.tb{border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:.3rem .7rem;border-radius:.375rem;font:600 .75rem system-ui;cursor:pointer}
.tb:hover{background:#334155}
.tb[aria-pressed=true]{background:seagreen;border-color:seagreen;color:white}

main{flex:1;display:grid;grid-template-columns:15rem 22rem 1fr;gap:.6rem;padding:.6rem;min-height:0}
@media(max-width:1200px){main{grid-template-columns:13rem 1fr}#right{grid-column:1/-1}}
@media(max-width:800px){main{grid-template-columns:1fr;grid-auto-rows:minmax(12rem,auto)}}
.panel{background:white;border:1px solid gainsboro;border-radius:.625rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:.5rem .75rem;border-bottom:1px solid gainsboro;font:700 .66rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;display:flex;align-items:center;gap:.4rem;background:snow;flex:none}
.ph .sp{flex:1}
.body{overflow:auto;min-height:0;padding:.75rem}

/* list */
.grp{margin-bottom:.75rem}
.glab{margin:0 0 .3rem;font:700 .64rem system-ui;letter-spacing:.05em;text-transform:uppercase;color:dimgray;display:flex}
.glab span{margin-left:auto;color:seagreen;font-variant-numeric:tabular-nums}
.item{display:flex;gap:.4rem;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:.3rem .4rem;border-radius:.35rem;cursor:pointer;font:inherit;font-size:.8rem;line-height:1.3}
.item:hover{background:aliceblue}
.item[aria-current=true]{background:steelblue;color:white}
.item.ok .ttl{color:seagreen}
.item[aria-current=true].ok .ttl{color:white}
.iid{font:700 .62rem ui-monospace,monospace;color:slategray;flex:none}
.item[aria-current=true] .iid{color:#cbd5e1}

/* brief */
#brief h2{margin:0 0 .35rem;font-size:1rem;line-height:1.3}
.goal{margin:0 0 .75rem;color:#334155}
.slab{margin:1rem 0 .35rem;font:700 .64rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray}
.use{margin:0;padding:0;list-style:none;display:grid;gap:.35rem}
.use li{display:grid;grid-template-columns:auto 1fr;gap:.5rem;align-items:baseline;background:whitesmoke;padding:.35rem .5rem;border-radius:.35rem}
.use code{font:700 .74rem ui-monospace,monospace;color:#1e3a5f;white-space:nowrap}
.use span{font-size:.82rem;color:#475569}
.task{margin:0;background:#fffbeb;border-left:3px solid goldenrod;padding:.5rem .65rem;border-radius:0 .35rem .35rem 0;font-size:.88rem}
.why{margin:0;font-size:.82rem;color:#475569;font-style:italic}
.hint{margin-bottom:.3rem}
.hint button{border:1px solid gainsboro;background:white;border-radius:.35rem;padding:.25rem .6rem;font:600 .72rem system-ui;cursor:pointer;color:#334155}
.hint button:hover{background:whitesmoke}
.hint p{display:none;margin:.35rem 0 0;font-size:.82rem;background:whitesmoke;padding:.5rem;border-radius:.35rem}
.hint.open p{display:block}
.sol pre{display:none;margin:.4rem 0 0;background:#0f172a;color:#e2e8f0;padding:.6rem;border-radius:.4rem;font:.74rem/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-x:auto}
.sol.open pre{display:block}
.sol button{border:1px solid gainsboro;background:white;border-radius:.35rem;padding:.25rem .6rem;font:600 .72rem system-ui;cursor:pointer}

/* files + preview */
#right{display:grid;grid-template-rows:1fr 1fr;gap:.6rem;min-height:0}
.ftab{border:0;background:none;padding:.3rem .6rem;border-radius:.3rem;font:600 .72rem ui-monospace,monospace;cursor:pointer;color:dimgray}
.ftab[aria-selected=true]{background:steelblue;color:white}
.ftab.ro::after{content:' ro';font-size:.6rem;opacity:.7}
.edwrap{flex:1;min-height:0;display:flex}
.edwrap[hidden]{display:none}
textarea{flex:1;width:100%;border:0;resize:none;font:13px/1.6 ui-monospace,monospace;padding:.6rem;outline:0;white-space:pre-wrap}
.mini{border:1px solid silver;background:white;border-radius:.3rem;font:600 .68rem system-ui;padding:.15rem .5rem;cursor:pointer}
.mini:hover{background:whitesmoke}
#appnote{font:600 .62rem system-ui;color:darkorange;text-transform:none;letter-spacing:0}
.stat{font:700 .66rem ui-monospace,monospace}
.stat.good{color:seagreen}.stat.bad{color:firebrick}
#out{flex:1;width:100%;border:0;background:white;min-height:0}
#err{display:none;white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;color:#7f1d1d;background:#fee2e2;padding:.6rem;border-top:1px solid #fecaca;max-height:9rem;overflow:auto;flex:none}
#err.show{display:block}
</style>
</head><body>

<header class="top">
  <h1>CSS 100</h1>
  <select id="filter" data-tip="Filter the list by topic"></select>
  <button class="tb" id="prev" data-tip="Previous question">←</button>
  <button class="tb" id="next" data-tip="Next question">→</button>
  <div class="prog"><i></i></div>
  <span id="cnt">0 / 100</span>
  <button class="tb" id="markdone" aria-pressed="false" data-tip="Mark this one solved — saved locally">Mark solved</button>
</header>

<main>
  <section class="panel">
    <p class="ph">Questions</p>
    <div class="body" id="list"></div>
  </section>

  <section class="panel">
    <p class="ph">Brief</p>
    <div class="body" id="brief"></div>
  </section>

  <div id="right">
    <section class="panel">
      <p class="ph">
        <button class="ftab" data-f="jsx" aria-selected="false">component.jsx</button>
        <button class="ftab" data-f="css" aria-selected="true">styles.css</button>
        <button class="ftab ro" data-f="app" aria-selected="false">app.css</button>
        <span class="sp"></span>
        <span id="appnote" hidden data-tip="This question builds something app.css already provides, so app.css is withheld — you write it yourself">app.css withheld</span>
        <button class="mini" id="fmt" data-tip="Format styles.css with Prettier">format</button>
        <button class="mini" id="reset" data-tip="Restore the starting code for this question">reset</button>
      </p>
      <div class="edwrap" id="jsxwrap" hidden><textarea id="jsx" spellcheck="false" data-mode="jsx"></textarea></div>
      <div class="edwrap" id="csswrap"><textarea id="css" spellcheck="false" data-mode="css"></textarea></div>
      <div class="edwrap" id="appwrap" hidden><textarea id="app" spellcheck="false" data-mode="css"></textarea></div>
    </section>
    <section class="panel">
      <p class="ph">Live result<span class="sp"></span><span class="stat" id="stat">—</span></p>
      <iframe id="out" title="preview"></iframe>
      <pre id="err"></pre>
    </section>
  </div>
</main>
