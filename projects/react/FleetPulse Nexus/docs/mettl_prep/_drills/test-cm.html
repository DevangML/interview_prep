<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="vendor/cm.css">
  <script src="vendor/cm.js"></script>
  <script src="vendor/cm-xml.js"></script>
  <script src="vendor/cm-js.js"></script>
  <script src="vendor/cm-jsx.js"></script>
</head>
<body>
  <textarea id="ed">const x = {</textarea>
  <script>
    var cm = CodeMirror.fromTextArea(document.getElementById('ed'), {
      mode: 'jsx', indentUnit: 2, tabSize: 2, smartIndent: true
    });
    cm.setCursor({line: 0, ch: 11});
    CodeMirror.commands.newlineAndIndent(cm);
    console.log(cm.getValue() === "const x = {\n  "); // if smart indent works, it will be true
    document.body.innerHTML += "<div id='res'>" + (cm.getValue() === "const x = {\n  ") + "</div>";
  </script>
</body>
</html>
