<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Layout Ladder</title><style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,sans-serif;color:#111827;background:#eef1f5}
.top{background:#0f172a;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:1.05rem}.top p{margin:4px 0 0;color:#94a3b8;font-size:.8rem}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.stagebtn{border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:6px 12px;border-radius:999px;font:600 .78rem system-ui;cursor:pointer;transition:background-color 150ms ease}
.stagebtn:hover{background:#334155}
.stagebtn[aria-selected=true]{background:#2563eb;border-color:#2563eb;color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 80px}
.prog{height:6px;background:#dbe2ea;border-radius:999px;overflow:hidden;margin:0 0 6px}
.prog i{display:block;height:100%;background:#2563eb;width:0;transition:width .25s}
.lesson{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:0 0 14px;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;cursor:pointer}
.lh:hover{background:#f1f5f9}
.lh h2{margin:0;font-size:.95rem;flex:1;font-weight:650}
.num{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#475569;display:grid;place-items:center;font:700 .72rem system-ui;flex:none}
.lesson.done .num{background:#16a34a;color:#fff}
.chev{color:#94a3b8;font-size:.75rem}
.lb{display:none;padding:16px}.lesson.open .lb{display:block}
.teach{margin:0 0 12px;color:#334155;font-size:.92rem;max-width:70ch}
.teach code,.task code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font:600 .85em ui-monospace,monospace;color:#be123c}
.task{margin:0 0 14px;padding:10px 12px;background:#eff6ff;border-left:3px solid #2563eb;border-radius:0 6px 6px 0;font-size:.88rem;max-width:78ch}
.task b{color:#1d4ed8}.task code{background:#dbeafe;color:#1e40af}
.pane{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.pane{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;min-width:0}
.slab{display:flex;align-items:center;gap:8px;font:700 .68rem system-ui;letter-spacing:.06em;color:#64748b;text-transform:uppercase;margin:0 0 6px}
.slab .sp{flex:1}
.mini{border:1px solid #cbd5e1;background:#fff;border-radius:5px;font:600 .68rem system-ui;padding:2px 8px;cursor:pointer;color:#475569;text-transform:none;letter-spacing:0}
.mini:hover{background:#f1f5f9}
textarea{width:100%;height:200px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;background:#fbfcfe;color:#0f172a;tab-size:2}
textarea:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.scaf{display:none;margin:8px 0 0}.scaf.open{display:block}
.scaf textarea{height:100px;background:#f1f5f9;color:#64748b;font-size:12.5px}
.rz{resize:horizontal;overflow:hidden;min-width:200px;max-width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
iframe{width:100%;height:210px;border:0;display:block;background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.b{padding:7px 14px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font:600 .84rem system-ui;cursor:pointer;transition:background-color 150ms ease}
.b:hover{background:#f8fafc}.b.p{background:#2563eb;border-color:#2563eb;color:#fff}
.b.p:hover{background:#1d4ed8}.b:active{transform:translateY(1px)}
.b:focus-visible,.mini:focus-visible,.stagebtn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.b[aria-pressed=true]{background:#16a34a;border-color:#16a34a;color:#fff}
.diff{border:1px solid #cbd5e1;border-radius:8px;overflow:auto;height:200px;background:#fbfcfe;
 font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 0}
.diff div{padding:0 12px 0 26px;white-space:pre;position:relative}
.diff div.add{background:#dcfce7;color:#14532d}
.diff div.add::before{content:'+';position:absolute;left:10px;color:#16a34a;font-weight:700}
.diff div.del{background:#fee2e2;color:#7f1d1d;text-decoration:line-through;text-decoration-color:rgb(127 29 29 / .35)}
.diff div.del::before{content:'−';position:absolute;left:10px;color:#dc2626;font-weight:700}
.diff div.same{color:#64748b}
.key{display:none;margin:10px 0 0;padding:10px 12px;background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 6px 6px 0;font-size:.86rem;color:#14532d;max-width:78ch}
.key.show{display:block}
.hint{color:#94a3b8;font-size:.78rem}
.sec-intro{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #2563eb;border-radius:8px;padding:14px 16px;margin:0 0 18px}
.sec-intro h3{margin:0 0 6px;font-size:1rem}.sec-intro p{margin:0;color:#475569;font-size:.9rem;max-width:80ch}
.ch{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:0 0 14px}
.ch h3{margin:0 0 8px;font-size:1rem}.ch p{margin:0 0 10px;color:#334155;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .72rem system-ui;background:#eff6ff;color:#1d4ed8;padding:3px 9px;border-radius:999px}
.rapid{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px}
.rapid ol{margin:0;padding-left:20px;color:#334155;font-size:.9rem}.rapid li{margin:5px 0}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font:600 .8em ui-monospace,monospace}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

.kn{border:1px solid gainsboro;border-radius:.5rem;background:snow;margin-top:.5rem;overflow:hidden;flex:none}
.kn-hd{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:#f8fafc;border-bottom:1px solid gainsboro;font:700 .64rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:dimgray;cursor:pointer;user-select:none;margin:0}
.kn-hd .sp{flex:1}
.kn-body{padding:.45rem .6rem;display:grid;gap:.3rem;max-height:11rem;overflow:auto}
.kn.closed .kn-body{display:none}
.kn-row{display:grid;grid-template-columns:8rem 1fr 4.2rem;gap:.5rem;align-items:center}
.kn-lab{font:600 .72rem ui-monospace,monospace;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn-val{font:600 .7rem ui-monospace,monospace;color:steelblue;text-align:right;white-space:nowrap}
.kn-rng{width:100%;accent-color:steelblue;height:1.1rem}
.kn-sel,.kn-txt{width:100%;font-size:.75rem;padding:.15rem .3rem;border:1px solid silver;border-radius:.25rem;background:white}
.kn-col{width:100%;height:1.4rem;padding:0;border:1px solid silver;border-radius:.25rem;background:white;cursor:pointer}
.kn-empty{margin:0;font:.75rem system-ui;color:dimgray}
</style><script src="vendor/babel.min.js"></script><script src="vendor/prettier-standalone.js"></script><script src="vendor/prettier-babel.js"></script><script src="vendor/prettier-estree.js"></script><script src="vendor/prettier-postcss.js"></script><script src="fmt.js?v=1787474763"></script><script src="preview.js?v=1787479426"></script><script src="inspect.js?v=1787404142"></script><script src="ux.js?v=1787480828"></script><link rel="stylesheet" href="vendor/cm.css"><link rel="stylesheet" href="editor.css?v=1787479467"><script src="vendor/cm.js"></script><script src="vendor/cm-css.js"></script><script src="vendor/cm-xml.js"></script><script src="vendor/cm-js.js"></script><script src="vendor/cm-jsx.js"></script><script src="vendor/cm-closeb.js"></script><script src="vendor/cm-closetag.js"></script><script src="vendor/cm-matchb.js"></script><script src="vendor/cm-activeline.js"></script><script src="vendor/cm-comment.js"></script><script src="editor.js?v=1787560995"></script><script src="vendor/split.js"></script><link rel="stylesheet" href="files.css?v=1787475474"><script src="files.js?v=1787478830"></script><link rel="stylesheet" href="theme.css?v=1787480460"><script src="sheets.js?v=1787478976"></script><script src="migrate.js?v=1787558826"></script><script src="compile.js?v=1787558907"></script><script src="cssmodel.js?v=1787478700"></script><script src="direct.js?v=1787479101"></script><script src="inspector.js?v=1787478976"></script><link rel="stylesheet" href="shell.css?v=1787478912"><script src="panes.js?v=1787479101"></script><script src="tip.js?v=1787479075"></script></head><body class="doc"><header class="top"><h1>CSS Layout Ladder</h1><p>Atoms → system → polish → units → compose → speed → challenges. Named colours, relative units, every box live.</p><div class="stages" role="tablist"><button class="stagebtn" data-s="1" aria-selected="true">1 · Atoms</button><button class="stagebtn" data-s="2" aria-selected="false">2 · System</button><button class="stagebtn" data-s="3" aria-selected="false">3 · Polish</button><button class="stagebtn" data-s="35" aria-selected="false">4 · Units</button><button class="stagebtn" data-s="25" aria-selected="false">5 · JSX</button><button class="stagebtn" data-s="26" aria-selected="false">6 · Reactivity</button><button class="stagebtn" data-s="4" aria-selected="false">7 · Compose</button><button class="stagebtn" data-s="5" aria-selected="false">8 · Rapid</button><button class="stagebtn" data-s="6" aria-selected="false">9 · Challenges</button></div></header><div class="wrap"><div class="prog"><i></i></div><p class="hint" id="cnt" style="margin:0 0 14px"></p><div id="body"></div></div><script>const DATA={"lessons": [{"stage": 1, "title": "The box model \u2014 why your 14rem box is not 14rem", "teach": "You wrote <code>width:14rem<\/code> \u2014 that is <b>224px<\/b>. But <code>width<\/code> sizes the <b>content only<\/b>; padding and border are added <b>on top<\/b>. So the box actually occupies <b>224 + 20 + 20 = 264px<\/b> \u2014 40px wider than you asked for.<br><br><code>box-sizing:border-box<\/code> changes what <code>width<\/code> <i>means<\/i>: 224px becomes the <b>total<\/b>, and the padding eats inward instead of pushing outward.<br><br>The dashed red line is exactly 14rem. Watch where the card's right edge sits relative to it.", "html": "<div class=\"ruler\"><span>14rem \u2014 what you asked for<\/span><\/div><div class=\"card\"><h3>Account settings<\/h3><p>Manage how your workspace behaves.<\/p><\/div><p class=\"note\">Card overhanging the dashed line? That gap <em>is<\/em> your padding, added on top of the width.<\/p>", "css": ".card{\n  width:14rem;      /* content only, for now */\n  padding:1.25rem;  /* adds 20px on each side */\n  background:steelblue;color:white;\n  border-radius:.5rem;\n}\n", "task": "Add <code>box-sizing:border-box<\/code> to <code>.card<\/code>. Its right edge snaps back and lands exactly on the dashed line.", "key": "Without border-box: width = content, and padding/border push the box wider. With it: width = the whole visible box. That is why the reset is line one of every stylesheet.", "base": "/* undo the harness reset so you see the REAL browser default */\n*{box-sizing:content-box}\n.ruler{box-sizing:border-box}\nbody{font:1rem/1.5 system-ui;color:black;background:whitesmoke;margin:0;padding-top:1.1rem}\n.ruler{width:14rem;border:2px dashed crimson;border-bottom:0;height:.9rem;position:relative;margin-bottom:-2px}\n.ruler span{position:absolute;top:-1.05rem;left:0;font:600 .68rem system-ui;color:crimson;white-space:nowrap}\n.card h3{margin:0 0 .25rem;font-size:1rem}\n.card p{margin:0;font-size:.875rem;opacity:.85}\n.note{font:.75rem/1.45 system-ui;color:dimgray;max-width:19rem;margin:.85rem 0 0}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "display: block vs inline", "teach": "<code>block<\/code> takes the full line and accepts width/height. <code>inline<\/code> flows in the text and IGNORES width/height. <code>inline-block<\/code> flows but accepts them.", "html": "<span class=\"tag\">Design<\/span><span class=\"tag\">Engineering<\/span><span class=\"tag\">Product<\/span>", "css": ".tag{\n  width:8rem;\n  background:steelblue;color:white;\n  padding:.375rem .75rem;border-radius:999px;\n  font:600 .8125rem system-ui;\n}\n", "task": "Width is being ignored \u2014 spans are inline. Add <code>display:inline-block<\/code>.", "key": "inline ignores width/height. inline-block accepts them and still flows.", "base": "body{font:1rem/1.5 system-ui;background:whitesmoke;padding:.5rem}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "display:flex \u2014 the switch that changes the children", "teach": "<code>display:flex<\/code> on a PARENT lays its children in a row. You style the parent; the children rearrange. This is the single most important line in CSS layout.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  background:gainsboro;padding:12px;\n}\n", "task": "Add <code>display:flex<\/code> to .row. The three boxes jump onto one line.", "key": "display:flex \u2014 children become flex items in a row.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "flex-direction defines the MAIN axis", "teach": "This is THE idea people miss. <code>flex-direction<\/code> decides which way is 'main'. Row \u2192 main is horizontal. Column \u2192 main is VERTICAL. Every other flex property is described relative to that axis.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  display:flex;\n  flex-direction:row;\n  background:gainsboro;padding:12px;\n}\n", "task": "Switch to <code>column<\/code>. Then back. Say out loud which way 'main' points each time.", "key": "row \u2192 main = horizontal. column \u2192 main = vertical. Everything else follows this.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "justify-content works on the MAIN axis", "teach": "Positions items ALONG the main axis. In a row that's left\u2194right. Values: flex-start, center, flex-end, space-between, space-around, space-evenly.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  display:flex;\n  justify-content:flex-start;\n  background:gainsboro;padding:12px;\n}\n", "task": "Try <code>center<\/code>, then <code>space-between<\/code>. Then add <code>flex-direction:column<\/code> and try again \u2014 notice it now moves them VERTICALLY.", "key": "justify-content = main axis. It follows flex-direction, not the screen.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "align-items works on the CROSS axis", "teach": "The cross axis is perpendicular to main. In a row, cross is vertical \u2014 so align-items controls vertical alignment. That's why <code>align-items:center<\/code> vertically centres a row.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\" style=\"padding:28px 18px\">tall<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  display:flex;\n  align-items:stretch;\n  background:gainsboro;padding:12px;\n}\n", "task": "Try <code>center<\/code>, then <code>flex-start<\/code>, then <code>baseline<\/code>.", "key": "justify = main. align = cross. In a row: justify is horizontal, align is vertical.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "gap \u2014 spacing without margins", "teach": "<code>gap<\/code> puts space BETWEEN items only, never on the outside edges. It replaced the old margin-right-on-every-child-except-last hack. Works in flex and grid.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  display:flex;\n  gap:0px;\n  background:gainsboro;padding:12px;\n}\n", "task": "Set <code>gap:16px<\/code>. Notice no space appears at the outer edges.", "key": "gap = between only. Use it instead of child margins.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "flex: grow shrink basis", "teach": "On a CHILD. <code>flex:1<\/code> means 'take the leftover space'. The full form <code>flex:1 1 200px<\/code> = grow yes, shrink yes, start at 200px. This is how you make one column fill while others stay fixed.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{display:flex;gap:8px;background:gainsboro;padding:12px}\n.a{\n  flex:0 1 auto;\n}\n", "task": "Give .a <code>flex:1<\/code>. Then try <code>flex:1 1 200px<\/code>. Then put <code>flex:1<\/code> on .b too and watch them share.", "key": "flex:1 on a child = absorb the leftover space.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "flex-wrap \u2014 squashing vs wrapping", "teach": "By default flex items SHRINK rather than wrap, and can get unusably narrow. <code>flex-wrap:wrap<\/code> lets them drop to the next line instead. Essential for responsive bars.", "html": "<div class=\"row\"><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><div class=\"box d\">Help<\/div><div class=\"box a\">Logo<\/div><div class=\"box b\">Nav<\/div><div class=\"box c\">Avatar<\/div><div class=\"box d\">Help<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.row{\n  display:flex;\n  gap:8px;\n  flex-wrap:nowrap;\n  background:gainsboro;padding:12px;\n}\n", "task": "Set <code>wrap<\/code>. Then drag this panel narrower and watch the difference.", "key": "nowrap squashes. wrap drops to a new line. Bars almost always want wrap.", "base": ".box{min-width:120px}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "display:grid + grid-template-columns", "teach": "Grid is TWO-dimensional \u2014 you declare columns up front. <code>1fr<\/code> means 'one share of the free space'.", "html": "<div class=\"g\"><div class=\"box a\">A<\/div><div class=\"box b\">B<\/div><div class=\"box c\">C<\/div><div class=\"box d\">D<\/div><div class=\"box a\">A<\/div><div class=\"box b\">B<\/div><div class=\"box c\">C<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.g{\n  display:grid;\n  grid-template-columns:1fr;\n  gap:10px;background:gainsboro;padding:12px;\n}\n", "task": "Try <code>1fr 1fr 1fr<\/code>. Then <code>200px 1fr<\/code> \u2014 fixed sidebar, fluid main.", "key": "fr = a share of leftover space. 200px 1fr = the classic sidebar+main.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "repeat + minmax + auto-fit = responsive, zero media queries", "teach": "<code>repeat(auto-fit, minmax(160px,1fr))<\/code> means: fit as many columns as you can, each at least 160px, sharing leftover space. The whole responsive card grid is this one line.", "html": "<div class=\"g\"><div class=\"box a\">A<\/div><div class=\"box b\">B<\/div><div class=\"box c\">C<\/div><div class=\"box d\">D<\/div><div class=\"box a\">A<\/div><div class=\"box b\">B<\/div><div class=\"box c\">C<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.g{\n  display:grid;\n  grid-template-columns:repeat(3, 1fr);\n  gap:10px;background:gainsboro;padding:12px;\n}\n", "task": "Replace with <code>repeat(auto-fit, minmax(160px,1fr))<\/code>, then drag the panel narrower. Then try <code>auto-fill<\/code> and spot the difference.", "key": "auto-fit COLLAPSES empty tracks so items stretch. auto-fill KEEPS them, leaving a gap. Classic interview question.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "place-items:center \u2014 centring, solved", "teach": "On a grid container, <code>place-items:center<\/code> centres children on BOTH axes. Two words. This is the entire centred-box archetype.", "html": "<div class=\"g\"><div class=\"box a\">Centred<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.g{\n  display:grid;\n  height:220px;\n  background:gainsboro;\n}\n", "task": "Add <code>place-items:center<\/code>.", "key": "display:grid + place-items:center = perfectly centred, both axes.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "grid-template-areas \u2014 layout you can read", "teach": "Name regions, then draw the layout as ASCII. The app shell becomes one readable declaration instead of nested flex containers.", "html": "<div class=\"shell\"><div class=\"box a\" style=\"grid-area:hd\">header<\/div><div class=\"box b\" style=\"grid-area:sb\">side<\/div><div class=\"box c\" style=\"grid-area:main\">main<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.shell{\n  display:grid;\n  gap:8px;\n  grid-template-columns:140px 1fr;\n  grid-template-rows:50px 1fr;\n  grid-template-areas:\n    \"hd sb\"\n    \"main main\";\n  height:220px;background:gainsboro;padding:12px;\n}\n", "task": "Change the areas to <code>\"hd hd\"<\/code> then <code>\"sb main\"<\/code> so the header spans the top.", "key": "Repeating a name spans that cell. \"hd hd\" = header across both columns.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "position: relative / absolute / fixed / sticky", "teach": "<code>relative<\/code> nudges without leaving flow, and becomes the anchor for absolute children. <code>absolute<\/code> leaves flow and positions against the nearest positioned ancestor. <code>fixed<\/code> pins to the viewport. <code>sticky<\/code> is normal until it hits a threshold, then pins.", "html": "<div class=\"wrapx\"><div class=\"box a\">Card<\/div><div class=\"box b badge\">New<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.wrapx{\n  position:relative;\n  background:gainsboro;padding:12px;height:140px;\n}\n.badge{\n  position:static;\n}\n", "task": "Give .badge <code>position:absolute; top:8px; right:8px;<\/code>. Then remove <code>position:relative<\/code> from .wrapx and watch it escape.", "key": "absolute anchors to the nearest POSITIONED ancestor. None = it escapes to the page.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "inset:0 \u2014 cover the parent exactly", "teach": "<code>inset:0<\/code> is shorthand for top/right/bottom/left all 0. With position:fixed it covers the viewport \u2014 and unlike <code>width:100vw<\/code> it does NOT overflow when a scrollbar exists.", "html": "<div class=\"wrapx\"><p style=\"margin:0;font:14px system-ui\">Page content sits underneath<\/p><div class=\"ov\">Overlay<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.wrapx{position:relative;background:gainsboro;padding:12px;height:160px}\n.ov{\n  position:absolute;\n  background:rgb(0 0 0/.6);color:white;\n  display:grid;place-items:center;\n  font:600 14px system-ui;\n}\n", "task": "Add <code>inset:0<\/code> to .ov.", "key": "inset:0 = top/right/bottom/left 0. Use it for overlays, never width:100vw.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "Units: px, rem, %, dvh, clamp()", "teach": "<code>px<\/code> fixed \u00b7 <code>rem<\/code> scales with the user's font size (use for text/spacing) \u00b7 <code>%<\/code> of the parent \u00b7 <code>dvh<\/code> viewport height that is correct on mobile \u00b7 <code>clamp(min, ideal, max)<\/code> fluid with bounds.", "html": "<div class=\"mark\"><span>1.25rem floor<\/span><\/div><div class=\"box a t\">Fluid heading<\/div><div class=\"mark big\"><span>2rem ceiling<\/span><\/div><p class=\"hint2\">Drag the preview edge. The text scales between the two marks and never past them.<\/p>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.t{\n  font-size:16px;\n  padding:1rem;\n  width:100%;\n  max-width:400px;\n}\n", "task": "Try <code>font-size:clamp(14px, 4vw, 32px)<\/code> then drag the panel width.", "key": "clamp(min, fluid, max) \u2014 responsive type with no media query.", "base": "\n.mark{height:1.25rem;border-left:2px solid crimson;padding-left:.4rem;margin:.35rem 0;position:relative}\n.mark.big{height:2rem}\n.mark span{font:600 .65rem system-ui;color:crimson;position:absolute;top:0;left:.5rem}\n.hint2{font:.7rem/1.4 system-ui;color:dimgray;margin:.6rem 0 0}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": "Media queries \u2014 the escape hatch", "teach": "For when a layout must change SHAPE, not just scale. Mobile-first: write the small layout, then add <code>@media (min-width: \u2026)<\/code> for bigger. Pick breakpoints where YOUR content breaks, not from device names.", "html": "<div class=\"g\"><div class=\"box a\">A<\/div><div class=\"box b\">B<\/div><div class=\"box c\">C<\/div><div class=\"box d\">D<\/div><\/div>", "css": ".box{background:steelblue;color:white;padding:12px 18px;border-radius:6px;font:600 14px system-ui}\n.b{background:slateblue}.c{background:seagreen}.d{background:goldenrod}\n.g{\n  display:grid;\n  grid-template-columns:1fr;\n  gap:8px;background:gainsboro;padding:12px;\n}\n\n@media (min-width:500px){\n  /* your rule here */\n}\n", "task": "Inside the media query set <code>.g{grid-template-columns:1fr 1fr}<\/code>. Then drag the panel across 500px.", "key": "Mobile-first: base = small. min-width queries add complexity as space appears.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 1, "title": ":focus-visible \u2014 the accessibility line that is scored", "teach": "Keyboard users must SEE where they are. <code>:focus-visible<\/code> shows a ring for keyboard focus but not mouse clicks. One global rule covers your whole build.", "html": "<button class=\"btn\">Save changes<\/button> <button class=\"btn\">Cancel<\/button>", "css": ".btn{padding:8px 16px;border:1px solid silver;border-radius:6px;background:white;font:inherit;cursor:pointer}\n\n/* add the rule here */\n", "task": "Add <code>.btn:focus-visible{outline:2px solid steelblue; outline-offset:2px}<\/code> then click into the preview and press Tab.", "key": ":focus-visible = keyboard only. Never remove outlines without replacing them.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "The problem: bespoke CSS doesn't scale under a clock", "teach": "Look right \u2014 that's three components, each with its own hand-rolled spacing and colour. ~30 lines for three boxes. In a 25-minute build you'd write this four more times. The next seven lessons replace ALL of it with reusable classes you type once.", "html": "<div class=\"a\"><h3>One<\/h3><p>Body<\/p><\/div><div class=\"b\"><h3>Two<\/h3><p>Body<\/p><\/div><div class=\"c\"><h3>Three<\/h3><p>Body<\/p><\/div>", "css": ".a{background:white;border:1px solid gainsboro;border-radius:8px;padding:16px;margin-bottom:16px}\n.a h3{margin:0 0 8px}\n.a p{margin:0;color:dimgray}\n.b{background:white;border:1px solid gainsboro;border-radius:8px;padding:16px;margin-bottom:16px}\n.b h3{margin:0 0 8px}\n.b p{margin:0;color:dimgray}\n.c{background:white;border:1px solid gainsboro;border-radius:8px;padding:16px}\n.c h3{margin:0 0 8px}\n.c p{margin:0;color:dimgray}\n", "task": "Count the duplication. Nothing to change here \u2014 just notice how much of it is the same three declarations repeated.", "key": "Three identical boxes, three copies of the CSS. This is the tax the system removes.", "base": "", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "Tokens \u2014 name the value once", "teach": "A custom property is a named value. Change <code>--brand<\/code> in one place and every use updates. Seven colours and four spaces is the whole palette \u2014 memorise those, derive the rest.", "html": "<div class=\"box\"><h3 style=\"margin:0 0 var(--s)\">Card<\/h3><p class=\"muted\" style=\"margin:0\">Muted body text<\/p><button class=\"btn\" data-v=\"primary\" style=\"margin-top:var(--m)\">Action<\/button><\/div>", "css": ":root{\n  --ink:black;\n  --muted:dimgray;\n  --line:gainsboro;\n  --surface:white;\n  --bg:whitesmoke;\n  --brand:steelblue;\n  --danger:firebrick;\n  --s:.5rem;\n  --m:1rem;\n  --l:1.5rem;\n  --xl:2rem;\n  --round:8px;\n}\n", "task": "Change <code>--brand<\/code> to <code>seagreen<\/code>. One edit, the button follows. Then change <code>--round<\/code> to <code>16px<\/code>.", "key": "Tokens = one name, many uses. Never repeat a hex value.", "base": "body{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "color-mix() \u2014 stop inventing colour tokens", "teach": "You need a hover shade, a tint, a border. Do NOT add three more tokens. Derive them from the one you have. <code>color-mix(in oklch, X 85%, black)<\/code> is the darker hover; mixing with <code>--surface<\/code> gives a tint.", "html": "<button class=\"btn\" data-v=\"primary\">Hover me<\/button> <span class=\"tint\">tinted surface<\/span>", "css": ".btn[data-v=primary]:hover{\n  background:royalblue;   /* hardcoded \u2014 replace me */\n}\n.tint{\n  padding:var(--s) var(--m);border-radius:6px;\n  background:gainsboro;      /* hardcoded \u2014 replace me */\n}\n", "task": "Replace both hardcoded values: hover \u2192 <code>color-mix(in oklch,var(--brand) 85%,black)<\/code>, tint \u2192 <code>color-mix(in oklch,var(--brand) 10%,var(--surface))<\/code>.", "key": "Two colours from one token. Change --brand and every derived shade follows.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "STACK \u2014 the highest-leverage class in CSS", "teach": "<code>.stack > * + *<\/code> is the owl selector: 'every child that has a sibling before it'. Margin is a property of the RELATIONSHIP between two elements, not of an element. So no leftover margin on the last child, ever. One class replaces every margin-bottom you would have written.", "html": "<div class=\"stack box\"><h3 style=\"margin:0\">Title<\/h3><p style=\"margin:0\" class=\"muted\">First paragraph.<\/p><p style=\"margin:0\" class=\"muted\">Second paragraph.<\/p><button class=\"btn\" data-v=\"primary\">Action<\/button><\/div>", "css": ".stack > * + * {\n  /* your rule here */\n}\n", "task": "Add <code>margin-block-start:var(--space,var(--m))<\/code>. Then add <code>style=\"--space:var(--xl)\"<\/code> to the .stack element and watch it re-space.", "key": "One class, all vertical rhythm. --space overrides per instance without a new class.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "CLUSTER and BETWEEN \u2014 everything horizontal", "teach": "<code>.cluster<\/code> = flex + wrap + gap + align-center: any row of things that should wrap gracefully. <code>.between<\/code> adds space-between: the whole action-bar archetype.", "html": "<div class=\"between box\"><strong>Team members<\/strong><div class=\"cluster\"><button class=\"btn\">Filter<\/button><button class=\"btn\" data-v=\"primary\">Invite<\/button><\/div><\/div>", "css": ".cluster{\n  /* your rule */\n}\n.between{\n  /* your rule */\n}\n", "task": "cluster \u2192 <code>display:flex;flex-wrap:wrap;gap:var(--m);align-items:center<\/code>. between \u2192 same plus <code>justify-content:space-between<\/code>. Then drag narrow.", "key": "cluster = a wrapping row. between = the same, pushed apart. Two classes, every toolbar you'll ever build.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "SIDEBAR \u2014 responsive with NO media query", "teach": "The trick: the sidebar gets a fixed-ish basis; the main gets <code>flex-grow:999<\/code> so it eats all spare space, plus <code>min-inline-size:50%<\/code>. When main would drop under 50%, flex-wrap fires and they stack. The layout responds to its OWN width, not the viewport's.", "html": "<div class=\"sidebar\"><div class=\"box\"><strong>Nav<\/strong><p class=\"muted\" style=\"margin:var(--s) 0 0\">Sidebar<\/p><\/div><div class=\"box\"><strong>Main<\/strong><p class=\"muted\" style=\"margin:var(--s) 0 0\">Drag the preview edge \u2014 it stacks on its own.<\/p><\/div><\/div>", "css": ".sidebar{display:flex;flex-wrap:wrap;gap:var(--m)}\n.sidebar > :first-child{\n  flex-basis:15rem;\n  /* add flex-grow */\n}\n.sidebar > :last-child{\n  /* add the three lines */\n}\n", "task": "first-child \u2192 add <code>flex-grow:1<\/code>. last-child \u2192 <code>flex-basis:0; flex-grow:999; min-inline-size:50%<\/code>. Then drag the preview's right edge.", "key": "flex-grow:999 + min-inline-size:50% = self-collapsing. Zero media queries. This is the disruptive one.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "SWITCHER \u2014 equal columns that stack themselves", "teach": "<code>flex-basis:calc((30rem - 100%) * 999)<\/code>. If the container is wider than 30rem the calc goes negative, clamps to 0, and items share equally. Narrower, it goes huge, and each item takes a full line. One line of maths replaces a media query.", "html": "<div class=\"switcher\"><div class=\"box\"><strong>Plan 1<\/strong><p class=\"muted\" style=\"margin:var(--s) 0 0\">$10/mo<\/p><\/div><div class=\"box\"><strong>Plan 2<\/strong><p class=\"muted\" style=\"margin:var(--s) 0 0\">$20/mo<\/p><\/div><div class=\"box\"><strong>Plan 3<\/strong><p class=\"muted\" style=\"margin:var(--s) 0 0\">$30/mo<\/p><\/div><\/div>", "css": ".switcher{display:flex;flex-wrap:wrap;gap:var(--m)}\n.switcher > *{\n  flex-grow:1;\n  /* add the flex-basis calc */\n}\n", "task": "Add <code>flex-basis:calc((30rem - 100%) * 999)<\/code>. Drag the preview across ~480px.", "key": "The Holy Albatross. Container-relative switching, no media query, one line.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "EXCEPTIONS \u2014 data attributes, not modifier classes", "teach": "BEM gives you .btn--primary, .btn--ghost, .btn--danger, .btn--primary-large\u2026 an explosion. CUBE uses a data attribute: one hook, readable in the DOM, usable by JS too.", "html": "<div class=\"cluster\"><button class=\"btn\" data-v=\"primary\">Primary<\/button><button class=\"btn\">Default<\/button><button class=\"btn\" data-v=\"ghost\">Ghost<\/button><button class=\"btn\" data-tone=\"danger\">Danger<\/button><\/div>", "css": ".btn[data-v=ghost]{\n  /* your rule */\n}\n[data-tone=danger]{\n  /* your rule */\n}\n", "task": "ghost \u2192 <code>background:none;border-color:transparent<\/code>. danger \u2192 <code>color:var(--danger);border-color:var(--danger)<\/code>.", "key": "One attribute hook per variation. data-tone works on ANY block \u2014 that is why it is not .btn--danger.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}\n", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "Putting it together \u2014 the whole dashboard, no new CSS", "teach": "Everything below is composed from classes you already wrote. Read the class attributes: that is where the layout now lives. Component CSS: zero lines.", "html": "<div class=\"stack\"><div class=\"between box\"><strong>Dashboard<\/strong><div class=\"cluster\"><input class=\"input\" style=\"width:auto\" placeholder=\"Search\u2026\"><button class=\"btn\" data-v=\"primary\">Add<\/button><\/div><\/div><div class=\"sidebar\"><div class=\"box stack\"><strong>Filters<\/strong><p class=\"muted\" style=\"margin:0\">Status<\/p><p class=\"muted\" style=\"margin:0\">Owner<\/p><\/div><div class=\"grid-auto\"><div class=\"box stack\"><strong>Metric 1<\/strong><p class=\"muted\" style=\"margin:0\">Summary<\/p><\/div><div class=\"box stack\"><strong>Metric 2<\/strong><p class=\"muted\" style=\"margin:0\">Summary<\/p><\/div><div class=\"box stack\"><strong>Metric 3<\/strong><p class=\"muted\" style=\"margin:0\">Summary<\/p><\/div><div class=\"box stack\"><strong>Metric 4<\/strong><p class=\"muted\" style=\"margin:0\">Summary<\/p><\/div><\/div><\/div><\/div>", "css": ".stack > * + *{margin-block-start:var(--space,var(--m))}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.between{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center;justify-content:space-between}\n.sidebar{display:flex;flex-wrap:wrap;gap:var(--m)}\n.sidebar > :first-child{flex-basis:15rem;flex-grow:1}\n.sidebar > :last-child{flex-basis:0;flex-grow:999;min-inline-size:50%}\n.grid-auto{display:grid;gap:var(--m);grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}\n", "task": "Change nothing. Drag the preview from wide to narrow and watch three layouts respond independently. Then change <code>--m<\/code> to <code>1.5rem<\/code> \u2014 the whole page re-spaces from one edit.", "key": "Five words carry it: stack \u00b7 cluster \u00b7 sidebar \u00b7 switcher \u00b7 center. That is the entire memory load.", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--danger:firebrick;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:8px}\nbody{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:var(--s) var(--m);border:1px solid var(--line);border-radius:6px;font:inherit}\n.muted{color:var(--muted)}", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "THE DECISION \u2014 Grid when the parent decides, Flex when the content decides", "teach": "This is the rule the whole system hangs on, and it is the answer to \"why Grid here and Flex there?\" in an interview.<br><br><b>Grid<\/b> \u2014 you know the structure up front. Tracks, 2D, alignment <i>across<\/i> rows. The <b>parent<\/b> dictates sizing, top-down.<br><b>Flex<\/b> \u2014 you do not control the count or the widths. One direction, content-driven, should wrap on its own.<br><br><b>The tell:<\/b> if you are reaching for a third nested container to make things line up, you needed Grid one level higher.<br><br><span style=\"display:block;background:#ecfdf5;border-left:3px solid seagreen;padding:.55rem .7rem;border-radius:0 .3rem .3rem 0;font-size:.86rem;color:#065f46\"><b>Core.<\/b> This is the most likely CSS architecture question in the technical round, and the reasoning behind half the Mettl layout MCQs. Own it cold.<\/span>", "html": "<div class=\"demo\"><p class=\"lab\">GRID \u2014 parent owns the tracks<\/p><div class=\"g\"><div class=\"box\">Sidebar<\/div><div class=\"box\">Main<\/div><div class=\"box\">Aside<\/div><\/div><p class=\"lab\">FLEX \u2014 content flows and wraps<\/p><div class=\"cluster\"><button class=\"btn\">All<\/button><button class=\"btn\" data-v=\"primary\">Active<\/button><button class=\"btn\">Archived<\/button><button class=\"btn\">Deleted<\/button><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.muted{color:var(--muted)}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.lab{font:700 .62rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:crimson;margin:.9rem 0 .4rem}\n.demo>.lab:first-child{margin-top:0}\n", "css": ".g{\n  display:grid;\n  gap:var(--m);\n  grid-template-columns:10rem 1fr 8rem;\n}\n", "task": "Change <code>grid-template-columns<\/code> to <code>1fr 2fr 1fr<\/code> \u2014 the PARENT resized all three children. Now try to do that to the button row without touching the buttons. You cannot: that row is content-driven, which is why it is flex.", "key": "Grid = parent decides tracks, top-down, 2D. Flex = content decides, one direction, wraps. Ask 'who owns the sizing?' and the answer picks itself.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "Flat beats nested \u2014 the anti-pattern you are being hired to avoid", "teach": "The old way to get a header, sidebar, main and footer was four or five nested flex containers, each one existing only to hold the next. It works, but the structure lies about the layout and every change means re-reading the whole nest.<br><br><b>One grid with named areas replaces the entire nest.<\/b> The markup goes flat, and the layout becomes readable as ASCII.<br><br><span style=\"display:block;background:#ecfdf5;border-left:3px solid seagreen;padding:.55rem .7rem;border-radius:0 .3rem .3rem 0;font-size:.86rem;color:#065f46\"><b>Core.<\/b> <code>grid-template-areas<\/code> is plain Grid \u2014 squarely inside Mettl's CSS3 scope, and the cleanest answer to \"how would you build this dashboard?\"<\/span>", "html": "<div class=\"page\"><header class=\"hd\">Header<\/header><aside class=\"sb\">Sidebar<\/aside><main class=\"mn\">Main content<\/main><footer class=\"ft\">Footer<\/footer><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.muted{color:var(--muted)}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.page>*{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:.75rem;font:600 .85rem system-ui}\n.hd{background:steelblue;color:white}.ft{background:slateblue;color:white}\n", "css": ".page{\n  display:grid;\n  gap:var(--s);\n  /* one declaration replaces 4 nested flex wrappers */\n  grid-template-areas:\n    \"hd hd\"\n    \"sb mn\"\n    \"ft ft\";\n  grid-template-columns:8rem 1fr;\n}\n.hd{grid-area:hd}\n.sb{grid-area:sb}\n.mn{grid-area:mn}\n.ft{grid-area:ft}\n", "task": "Swap the sidebar to the right: change the areas to <code>\"hd hd\"<\/code> / <code>\"mn sb\"<\/code> / <code>\"ft ft\"<\/code> and the columns to <code>1fr 8rem<\/code>. Four HTML elements, zero wrappers, one edit.", "key": "Named areas = flat markup + a layout you can read. Nesting containers to fake structure is the 2020 habit; this replaces it.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "<span style=\"display:inline-block;background:goldenrod;color:white;font:700 .6rem system-ui;padding:.1rem .45rem;border-radius:999px;letter-spacing:.04em;margin-right:.4rem;vertical-align:middle\">BONUS<\/span>SUBGRID \u2014 align card internals across cards, no fixed heights", "teach": "Cards in a row never line up: one has a longer title, so its button sits lower. The old fixes were fixed heights or JS.<br><br><b>Subgrid lets a child inherit the PARENT's row tracks.<\/b> Each card spans the same three rows, so every title, body and button aligns across the whole row \u2014 automatically, at any content length.<br><br><span style=\"display:block;background:#fffbeb;border-left:3px solid goldenrod;padding:.55rem .7rem;border-radius:0 .3rem .3rem 0;font-size:.86rem;color:#78350f\"><b>Exam weighting:<\/b> Mettl names <i>Flexbox<\/i> and <i>responsive design<\/i> in its CSS3 competency list \u2014 it does not name this. Understand what it solves so you can say one sentence about it in the technical round. <b>Do not drill it.<\/b><\/span>", "html": "<p class=\"lab\">watch the three Choose buttons<\/p><div class=\"cards\"><div class=\"c\"><h4>Starter<\/h4><p class=\"muted\">Short blurb.<\/p><button class=\"btn\" data-v=\"primary\">Choose<\/button><\/div><div class=\"c\"><h4>Team plan for growing companies<\/h4><p class=\"muted\">A much longer description that wraps onto several lines and pushes everything down.<\/p><button class=\"btn\" data-v=\"primary\">Choose<\/button><\/div><div class=\"c\"><h4>Scale<\/h4><p class=\"muted\">Medium length blurb here.<\/p><button class=\"btn\" data-v=\"primary\">Choose<\/button><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.muted{color:var(--muted)}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.cards{display:grid;gap:.5rem;grid-template-columns:repeat(3,1fr)}   /* 3 across so you can see the alignment */\n.c{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:.6rem;font-size:.8rem}\n.c h4{font-size:.85rem}\n.c .btn{padding:.35em .6em;font-size:.75rem}\n.c h4,.c p{margin:0}\n.lab{font:700 .6rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:crimson;margin:0 0 .4rem}\n", "css": ".cards{\n  /* rows the cards will share */\n  grid-template-rows:auto;\n}\n.c{\n  /* each card is its own little grid, for now */\n  display:grid;\n  gap:var(--s);\n}\n", "task": "Make the buttons line up: on <code>.cards<\/code> add <code>grid-template-rows:auto auto auto<\/code>; on <code>.c<\/code> add <code>grid-row:span 3<\/code> and <code>grid-template-rows:subgrid<\/code>. The cards now share the parent's rows.", "key": "subgrid = the child adopts the parent's tracks. Cross-card alignment with no fixed heights, no JS, no nesting.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 2, "title": "<span style=\"display:inline-block;background:goldenrod;color:white;font:700 .6rem system-ui;padding:.1rem .45rem;border-radius:999px;letter-spacing:.04em;margin-right:.4rem;vertical-align:middle\">BONUS<\/span>CONTAINER QUERIES \u2014 a component that responds to ITSELF", "teach": "A media query asks how wide the <i>viewport<\/i> is. That is the wrong question for a component that might sit in a wide main column or a narrow sidebar.<br><br><code>container-type:inline-size<\/code> turns a parent into a query container; <code>@container<\/code> then asks how wide <b>that box<\/b> is. This is what finally kills the old flexbox width hacks \u2014 a component becomes genuinely portable.<br><br><span style=\"display:block;background:#fffbeb;border-left:3px solid goldenrod;padding:.55rem .7rem;border-radius:0 .3rem .3rem 0;font-size:.86rem;color:#78350f\"><b>Exam weighting:<\/b> Mettl names <i>Flexbox<\/i> and <i>responsive design<\/i> in its CSS3 competency list \u2014 it does not name this. Understand what it solves so you can say one sentence about it in the technical round. <b>Do not drill it.<\/b><\/span>", "html": "<div class=\"wide contains\"><p class=\"lab\">same component, wide container<\/p><div class=\"card\"><img alt=\"\" class=\"ph\"><div><h4>Portable card<\/h4><p class=\"muted\">Side by side when it has room.<\/p><\/div><\/div><\/div><div class=\"narrow contains\"><p class=\"lab\">same component, narrow container<\/p><div class=\"card\"><img alt=\"\" class=\"ph\"><div><h4>Portable card<\/h4><p class=\"muted\">Stacks when it does not.<\/p><\/div><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.muted{color:var(--muted)}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.lab{font:700 .6rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:crimson;margin:0 0 .35rem}\n.wide{max-width:100%}.narrow{max-width:14rem;margin-top:1rem}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m);display:grid;gap:var(--s)}\n.card h4,.card p{margin:0}.ph{width:100%;height:3rem;background:aliceblue;border-radius:.375rem}\n", "css": ".contains{\n  /* your rule here */\n}\n\n@container (min-width:22rem){\n  .card{\n    /* and here */\n  }\n}\n", "task": "Add <code>container-type:inline-size<\/code> to <code>.contains<\/code>, then inside the <code>@container<\/code> block set <code>.card{grid-template-columns:5rem 1fr;align-items:center}<\/code>. One component, two layouts, and NOT a media query in sight.", "key": "container-type on the parent, @container on the child. The component responds to its own box \u2014 which is why it can be dropped anywhere.", ort<\/h3><p class=\"b\">Revenue grew across every region.<\/p><p class=\"m\">Updated 2 hours ago<\/p><\/div><div class=\"card\"><p class=\"lab\">after \u2014 your CSS<\/p><p class=\"eyebrow\">Finance<\/p><h3>Quarterly report<\/h3><p class=\"body\">Revenue grew across every region.<\/p><p class=\"meta\">Updated 2 hours ago<\/p><\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;padding:16px;color:black}\n.card{background:white;border:1px solid gainsboro;max-width:420px}\n.card h3{margin:0}\n.card p{margin:0}\n.row{display:flex}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;padding:8px 16px;border-radius:6px}\n.btn.p{background:steelblue;border-color:steelblue;color:white}\n\n.card p{margin:0}\n.card h3{margin:0}\n\n.pair{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}\n.card{padding:1.25rem;background:white;border:1px solid gainsboro;border-radius:.5rem}\n.card p{margin:0}.card h3{margin:0}\n.lab{font:700 .62rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:crimson;margin-bottom:.5rem!important}\n.pair .card.ctl .e,.pair .card.ctl h3,.pair .card.ctl .b,.pair .card.ctl .m{font-size:20px!important;font-weight:400!important;color:black!important;letter-spacing:normal!important;text-transform:none!important}\n", "css": ".eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:dimgray}\n.card h3{font-size:20px;font-weight:600;margin:4px 0 8px}\n.body{font-size:15px;color:black}\n.meta{font-size:13px;color:darkgray;margin-top:12px}", "before": ".eyebrow{font-size:20px}\n.card h3{font-size:34px}\n.body{font-size:18px}\n.meta{font-size:16px}", "after": ".eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:dimgray}\n.card h3{font-size:20px;font-weight:600;margin:4px 0 8px}\n.body{font-size:15px;color:black}\n.meta{font-size:13px;color:darkgray;margin-top:12px}", "bdiff": [{"t": ".eyebrow{font-size:20px}"
