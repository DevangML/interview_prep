accent-color:steelblue}\n.btn.p:hover{background:color-mix(in oklch,steelblue 85%,black)}\n.btn.p:active{transform:translateY(1px)}\n.btn:focus-visible{outline:2px solid steelblue;outline-offset:2px}", "bdiff": [{"t": "body{}", "k": "del"}, {"t": ".btn.p:hover{}", "k": "del"}, {"t": ".btn.p:active{}", "k": "del"}, {"t": ".btn:focus-visible{}", "k": "del"}], "adiff": [{"t": "body{accent-color:steelblue}", "k": "add"}, {"t": ".btn.p:hover{background:color-mix(in oklch,steelblue 85%,black)}", "k": "add"}, {"t": ".btn.p:active{transform:translateY(1px)}", "k": "add"}, {"t": ".btn:focus-visible{outline:2px solid steelblue;outline-offset:2px}", "k": "add"}], "why": "Click into the preview and press Tab. Four rules and the control finally feels like a control.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 3, "title": "Respect the user \u2014 reduced motion and colour-scheme", "teach": "Two rules that cost nothing and mark you as someone who ships real products. <code>prefers-reduced-motion<\/code> honours people who get sick from animation. <code>color-scheme<\/code> makes native controls and scrollbars match your theme.", "html": "<div class=\"card\"><h3>Settings<\/h3><p>Native controls follow color-scheme.<\/p><input class=\"in\" placeholder=\"Type here\"><div class=\"row\"><button class=\"btn p\">Save<\/button><\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;padding:16px;color:black}\n.card{background:white;border:1px solid gainsboro;max-width:420px}\n.card h3{margin:0}\n.card p{margin:0}\n.row{display:flex}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;padding:8px 16px;border-radius:6px}\n.btn.p{background:steelblue;border-color:steelblue;color:white}\n.card{padding:24px;max-width:420px}\n.card h3{margin-bottom:8px}\n.card p{margin-bottom:16px}\n.in{width:100%;padding:8px 12px;border:1px solid gainsboro;border-radius:6px;font:inherit;margin-bottom:16px}\n", "css": ":root{color-scheme:light dark}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.01ms !important;\n    transition-duration:.01ms !important}\n}", "before": "/* nothing yet */", "after": ":root{color-scheme:light dark}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.01ms !important;\n    transition-duration:.01ms !important}\n}", "bdiff": [{"t": "/* nothing yet */", "k": "del"}], "adiff": [{"t": ":root{color-scheme:light dark}", "k": "add"}, {"t": "@media (prefers-reduced-motion:reduce){", "k": "add"}, {"t": "  *{animation-duration:.01ms !important;", "k": "add"}, {"t": "    transition-duration:.01ms !important}", "k": "add"}, {"t": "}", "k": "add"}], "why": "Two rules, zero visual cost in the default case, and a real difference for people who need them.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "Why rem exists \u2014 it is an accessibility feature, not a style choice", "teach": "<code>rem<\/code> = <b>r<\/b>oot <b>em<\/b> = relative to the <code>&lt;html&gt;<\/code> font-size, which defaults to 16px. When a user raises their browser's default font size \u2014 and a lot of people do \u2014 <b>everything in rem scales and everything in px ignores them<\/b>. That is the whole argument. It is not aesthetics.", "html": "<div class=\"sim\"><p class=\"lab\">Simulating a user who set their browser font to 20px:<\/p><div class=\"card\"><h3>Quarterly report<\/h3><p>Revenue grew across every region this quarter.<\/p><button class=\"btn\">View report<\/button><\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.sim{font-size:20px}\n.lab{font-size:.75rem;color:dimgray;margin:0 0 .75rem}\n", "css": ".card{padding:1.5rem}\n.card h3{font-size:1.25rem}\n.card p{font-size:.9375rem}\n.btn{padding:.5rem 1rem;font-size:.875rem}", "before": ".card{padding:24px}\n.card h3{font-size:20px}\n.card p{font-size:15px}\n.btn{padding:8px 16px;font-size:14px}", "after": ".card{padding:1.5rem}\n.card h3{font-size:1.25rem}\n.card p{font-size:.9375rem}\n.btn{padding:.5rem 1rem;font-size:.875rem}", "bdiff": [{"t": ".card{padding:24px}", "k": "del"}, {"t": ".card h3{font-size:20px}", "k": "del"}, {"t": ".card p{font-size:15px}", "k": "del"}, {"t": ".btn{padding:8px 16px;font-size:14px}", "k": "del"}], "adiff": [{"t": ".card{padding:1.5rem}", "k": "add"}, {"t": ".card h3{font-size:1.25rem}", "k": "add"}, {"t": ".card p{font-size:.9375rem}", "k": "add"}, {"t": ".btn{padding:.5rem 1rem;font-size:.875rem}", "k": "add"}], "why": "The container is simulating a 20px root. Flip the toggle: the px version stays stubbornly small; the rem version respects the user.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "The rem scale you memorise once", "teach": "At the default 16px root the maths is clean, and it lands exactly on the 8/16/24/32 spacing scale you already know. Learn these seven and you never convert again:<br><br><code>.25rem=4 \u00b7 .5rem=8 \u00b7 .75rem=12 \u00b7 <b>1rem=16<\/b> \u00b7 1.5rem=24 \u00b7 2rem=32 \u00b7 3rem=48<\/code>", "html": "<div class=\"stack\"><div class=\"row s1\">.5rem<\/div><div class=\"row s2\">1rem<\/div><div class=\"row s3\">1.5rem<\/div><div class=\"row s4\">2rem<\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.stack{display:flex;flex-direction:column;gap:.5rem}\n.row{background:steelblue;color:white;border-radius:.375rem;font:600 .875rem system-ui}\n", "css": ".s1{padding:.5rem}\n.s2{padding:1rem}\n.s3{padding:1.5rem}\n.s4{padding:2rem}", "before": ".s1{padding:8px}\n.s2{padding:16px}\n.s3{padding:24px}\n.s4{padding:32px}", "after": ".s1{padding:.5rem}\n.s2{padding:1rem}\n.s3{padding:1.5rem}\n.s4{padding:2rem}", "bdiff": [{"t": ".s1{padding:8px}", "k": "del"}, {"t": ".s2{padding:16px}", "k": "del"}, {"t": ".s3{padding:24px}", "k": "del"}, {"t": ".s4{padding:32px}", "k": "del"}], "adiff": [{"t": ".s1{padding:.5rem}", "k": "add"}, {"t": ".s2{padding:1rem}", "k": "add"}, {"t": ".s3{padding:1.5rem}", "k": "add"}, {"t": ".s4{padding:2rem}", "k": "add"}], "why": "Identical rendering at the default root \u2014 but only one version survives a user who changes their font size. Same pixels today, different behaviour tomorrow.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "em \u2014 relative to THIS element, and it compounds", "teach": "<code>em<\/code> is relative to the <i>current element's<\/i> font-size, so it <b>multiplies when nested<\/b> \u2014 that is the footgun. But it is also exactly what you want for padding inside a control: <code>padding:.5em 1em<\/code> makes a button's padding scale with its own text, so one rule works for small and large buttons.", "html": "<div class=\"cluster\"><button class=\"btn sm\">Small<\/button><button class=\"btn\">Normal<\/button><button class=\"btn lg\">Large<\/button><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.cluster{display:flex;gap:.75rem;align-items:center}\n.sm{font-size:.75rem}\n.lg{font-size:1.25rem}\n", "css": ".btn{padding:.5em 1em}", "before": ".btn{padding:8px 16px}", "after": ".btn{padding:.5em 1em}", "bdiff": [{"t": ".btn{padding:8px 16px}", "k": "del"}], "adiff": [{"t": ".btn{padding:.5em 1em}", "k": "add"}], "why": "One rule, three sizes. With px all three get identical padding and the large button looks cramped; with em the padding follows the text.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "Where px still wins \u2014 do not cargo-cult", "teach": "\"Never use px\" is folklore. Some things should <b>not<\/b> scale with text: hairline borders, shadow offsets and blurs, and 1px dividers. A 1px border in rem becomes 2px at large font settings and the UI looks heavier for no reason. <b>Rule: type and space in rem, hairlines and shadows in px.<\/b>", "html": "<div class=\"card\"><h3>Quarterly report<\/h3><p>Revenue grew across every region this quarter.<\/p><button class=\"btn\">View report<\/button><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.card{padding:1.5rem}\n.card h3{font-size:1.25rem}\n.btn{padding:.5em 1em}\n", "css": ".card{border:1px solid gainsboro;\n      box-shadow:0 1px 2px rgb(0 0 0 / .05)}", "before": ".card{border:.0625rem solid gainsboro;\n      box-shadow:0 .0625rem .125rem rgb(0 0 0 / .05)}", "after": ".card{border:1px solid gainsboro;\n      box-shadow:0 1px 2px rgb(0 0 0 / .05)}", "bdiff": [{"t": ".card{border:.0625rem solid gainsboro;", "k": "del"}, {"t": "      box-shadow:0 .0625rem .125rem rgb(0 0 0 / .05)}", "k": "del"}], "adiff": [{"t": ".card{border:1px solid gainsboro;", "k": "add"}, {"t": "      box-shadow:0 1px 2px rgb(0 0 0 / .05)}", "k": "add"}], "why": "Both look identical here. The px version stays a true hairline at any zoom level; the rem version thickens. Keep hairlines in px on purpose, and be able to say why.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "Viewport units \u2014 and the two traps", "teach": "<code>vh<\/code>/<code>vw<\/code> are 1% of the viewport. Two traps: <b>(1)<\/b> <code>100vh<\/code> is wrong on mobile \u2014 it ignores the browser chrome, so content hides behind it. Use <code>100dvh<\/code> (dynamic). <b>(2)<\/b> <code>width:100vw<\/code> includes the scrollbar and causes horizontal overflow. Use <code>100%<\/code>, or <code>inset:0<\/code> for overlays.", "html": "<div class=\"hero\"><div class=\"card\"><h3>Centred hero<\/h3><p>Resize the preview height.<\/p><\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.hero{display:grid;place-items:center;background:aliceblue;border-radius:.5rem}\n", "css": ".hero{min-height:60dvh;\n      width:100%}", "before": ".hero{min-height:60vh;\n      width:100vw}", "after": ".hero{min-height:60dvh;\n      width:100%}", "bdiff": [{"t": ".hero{min-height:60vh;", "k": "del"}, {"t": "      width:100vw}", "k": "del"}], "adiff": [{"t": ".hero{min-height:60dvh;", "k": "add"}, {"t": "      width:100%}", "k": "add"}], "why": "Same result on desktop. On a phone the first version puts content under the URL bar and produces a sideways scroll. Two characters of difference.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "clamp() \u2014 fluid type, no media query, zoom still works", "teach": "<code>clamp(min, preferred, max)<\/code>. Put a <b>rem floor<\/b> and a <b>rem ceiling<\/b> around a <code>vw<\/code> middle and you get type that scales with the viewport but never gets unreadably small or absurdly large.<br><br><b>Never size text in raw <code>vw<\/code>.<\/b> It makes browser zoom do nothing \u2014 a genuine accessibility failure.", "html": "<div class=\"mark\"><span>1.25rem floor<\/span><\/div><div class=\"card\"><h3 class=\"fluid\">Fluid heading<\/h3><p>Drag the preview edge from narrow to wide.<\/p><\/div><div class=\"mark big\"><span>2rem ceiling<\/span><\/div><p class=\"hint2\">Drag the preview edge. The text scales between the two marks and never past them.<\/p>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.card{padding:1.5rem}\n\n.mark{height:1.25rem;border-left:2px solid crimson;padding-left:.4rem;margin:.35rem 0;position:relative}\n.mark.big{height:2rem}\n.mark span{font:600 .65rem system-ui;color:crimson;position:absolute;top:0;left:.5rem}\n.hint2{font:.7rem/1.4 system-ui;color:dimgray;margin:.6rem 0 0}\n", "css": ".fluid{font-size:clamp(1.25rem, 1rem + 2vw, 2rem)}", "before": ".fluid{font-size:4vw}", "after": ".fluid{font-size:clamp(1.25rem, 1rem + 2vw, 2rem)}", "bdiff": [{"t": ".fluid{font-size:4vw}", "k": "del"}], "adiff": [{"t": ".fluid{font-size:clamp(1.25rem, 1rem + 2vw, 2rem)}", "k": "add"}], "why": "Drag the preview. Raw vw keeps shrinking past readable and kills zoom; clamp holds a floor and a ceiling. The `1rem +` part keeps it zoom-responsive.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "Breakpoints and measure \u2014 em and ch", "teach": "Two more relative units earn their place. <b>Media queries in <code>em<\/code><\/b> (not px) so breakpoints respect the user's font size \u2014 <code>@media (min-width:40em)<\/code> = 640px at default. And <b><code>ch<\/code><\/b> for line length: <code>max-width:65ch<\/code> is literally \"65 characters wide\", which is the readability target.<br><br>The <b>top card has no measure<\/b> \u2014 full width, however wide the pane is. Yours is below it.", "html": "<div class=\"pair\"><div class=\"card wide\"><p class=\"lab\">no measure<\/p><p>The ideal line length is 60 to 75 characters. Setting a max-width in ch expresses that directly, instead of guessing at a pixel value that only happens to be right for one font size and one screen.<\/p><\/div><div class=\"card\"><p class=\"lab\">your CSS<\/p><p>The ideal line length is 60 to 75 characters. Setting a max-width in ch expresses that directly, instead of guessing at a pixel value that only happens to be right for one font size and one screen.<\/p><\/div><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n.card{padding:1.5rem}\n\n.pair{display:grid;gap:1rem}\n.card{padding:1.25rem;background:white;border:1px solid gainsboro;border-radius:.5rem}\n.card p{margin:0}.pair .card.wide{max-width:none!important}\n.lab{font:700 .62rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:crimson;margin-bottom:.5rem!important}\n", "css": ".card{max-width:65ch}\n@media (min-width:40em){\n  .card{padding:2rem}\n}", "before": ".card{max-width:640px}\n@media (min-width:640px){\n  .card{padding:32px}\n}", "after": ".card{max-width:65ch}\n@media (min-width:40em){\n  .card{padding:2rem}\n}", "bdiff": [{"t": ".card{max-width:640px}", "k": "del"}, {"t": "@media (min-width:640px){", "k": "del"}, {"t": "  .card{padding:32px}", "k": "del"}, {"t": "}", "k": "same"}], "adiff": [{"t": ".card{max-width:65ch}", "k": "add"}, {"t": "@media (min-width:40em){", "k": "add"}, {"t": "  .card{padding:2rem}", "k": "add"}, {"t": "}", "k": "same"}], "why": "ch says what you mean. em breakpoints move with the user's font size \u2014 px breakpoints do not.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 35, "title": "The whole rule, on one line", "teach": "<b>Type and space in <code>rem<\/code>. Component-internal padding in <code>em<\/code>. Line length in <code>ch<\/code>. Full-height in <code>dvh<\/code>. Fluid type in <code>clamp()<\/code> with rem bounds. Hairlines and shadows stay <code>px<\/code>.<\/b><br><br>That is the entire unit system. Everything below is that sentence applied.", "html": "<div class=\"card\"><h3 class=\"fluid\">Unit system<\/h3><p>Everything here follows the one-line rule.<\/p><button class=\"btn\">Action<\/button><\/div>", "base": "body{font:16px system-ui;background:whitesmoke;color:black;padding:1rem}\n.card{background:white;border:1px solid gainsboro;max-width:26rem}\n.card h3{margin:0 0 .5rem}\n.card p{margin:0 0 1rem;color:dimgray}\n.btn{border:1px solid gainsboro;background:white;font:inherit;cursor:pointer;border-radius:.375rem}\n", "css": ".card{max-width:65ch;padding:1.5rem;border:1px solid gainsboro;border-radius:.5rem}\n.fluid{font-size:clamp(1.125rem, 1rem + 1vw, 1.5rem)}\n.card p{max-width:65ch}\n.btn{padding:.5em 1em}", "before": ".card{max-width:400px;padding:24px;border:1px solid gainsboro;border-radius:8px}\n.fluid{font-size:22px}\n.card p{max-width:600px}\n.btn{padding:8px 16px}", "after": ".card{max-width:65ch;padding:1.5rem;border:1px solid gainsboro;border-radius:.5rem}\n.fluid{font-size:clamp(1.125rem, 1rem + 1vw, 1.5rem)}\n.card p{max-width:65ch}\n.btn{padding:.5em 1em}", "bdiff": [{"t": ".card{max-width:400px;padding:24px;border:1px solid gainsboro;border-radius:8px}", "k": "del"}, {"t": ".fluid{font-size:22px}", "k": "del"}, {"t": ".card p{max-width:600px}", "k": "del"}, {"t": ".btn{padding:8px 16px}", "k": "del"}], "adiff": [{"t": ".card{max-width:65ch;padding:1.5rem;border:1px solid gainsboro;border-radius:.5rem}", "k": "add"}, {"t": ".fluid{font-size:clamp(1.125rem, 1rem + 1vw, 1.5rem)}", "k": "add"}, {"t": ".card p{max-width:65ch}", "k": "add"}, {"t": ".btn{padding:.5em 1em}", "k": "add"}], "why": "One component, every rule applied. Note the border stayed px on purpose \u2014 that is the part most people get wrong in the other direction.", "polish": true, "isjsx": false, "jsx": ""}, {"stage": 4, "title": "Centred card \u2014 <code>cover<\/code> + <code>box<\/code>", "teach": "Two classes. <code>cover<\/code> centres on both axes; <code>box<\/code> is the card. The old version needed six declarations.", "html": "<div class=\"cover\"><div class=\"box stack\" style=\"max-width:22rem\"><h3 style=\"margin:0\">Sign in<\/h3><p class=\"muted\" style=\"margin:0\">Use your work email.<\/p><input class=\"input\" placeholder=\"you@company.com\"><button class=\"btn\" data-v=\"primary\">Continue<\/button><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.stack > * + *{margin-block-start:var(--space,var(--m))}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.between{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center;justify-content:space-between}\n.sidebar{display:flex;flex-wrap:wrap;gap:var(--m)}\n.sidebar > :first-child{flex-basis:var(--side,12rem);flex-grow:1}\n.sidebar > :last-child{flex-basis:0;flex-grow:999;min-inline-size:var(--min,50%)}\n.switcher{display:flex;flex-wrap:wrap;gap:var(--m)}\n.switcher > *{flex-grow:1;flex-basis:calc((var(--threshold,24rem) - 100%) * 999)}\n.grid-auto{display:grid;gap:var(--m);grid-template-columns:repeat(auto-fit,minmax(var(--col,12rem),1fr))}\n.center{margin-inline:auto;max-width:var(--measure,65ch);padding-inline:var(--m)}\n.cover{display:grid;place-items:center;min-block-size:var(--min,14rem)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:.5em .75em;border:1px solid var(--line);border-radius:var(--round);font:inherit}\n.muted{color:var(--muted)}\n", "css": "/* Nothing. Both classes already exist. */\n", "task": "Delete <code>cover<\/code> from the outer div \u2014 it drops to the top-left. Put it back.", "key": "cover = centred. box = card. stack = rhythm inside. Zero new CSS.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 4, "title": "Action bar \u2014 <code>between<\/code> + <code>cluster<\/code>", "teach": "<code>between<\/code> pushes the two halves apart and wraps; <code>cluster<\/code> keeps the buttons together. That is the whole toolbar.", "html": "<div class=\"between box\"><strong>Team members<\/strong><div class=\"cluster\"><input class=\"input\" style=\"width:auto\" placeholder=\"Search\u2026\"><button class=\"btn\">Filter<\/button><button class=\"btn\" data-v=\"primary\">Invite<\/button><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.stack > * + *{margin-block-start:var(--space,var(--m))}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.between{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center;justify-content:space-between}\n.sidebar{display:flex;flex-wrap:wrap;gap:var(--m)}\n.sidebar > :first-child{flex-basis:var(--side,12rem);flex-grow:1}\n.sidebar > :last-child{flex-basis:0;flex-grow:999;min-inline-size:var(--min,50%)}\n.switcher{display:flex;flex-wrap:wrap;gap:var(--m)}\n.switcher > *{flex-grow:1;flex-basis:calc((var(--threshold,24rem) - 100%) * 999)}\n.grid-auto{display:grid;gap:var(--m);grid-template-columns:repeat(auto-fit,minmax(var(--col,12rem),1fr))}\n.center{margin-inline:auto;max-width:var(--measure,65ch);padding-inline:var(--m)}\n.cover{displa adding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:.5em .75em;border:1px solid var(--line);border-radius:var(--round);font:inherit}\n.muted{color:var(--muted)}\n", "css": "/* Nothing. */\n", "task": "Add <code>style=\"--threshold:16rem\"<\/code> to the switcher and drag \u2014 it now switches at a different width.", "key": "switcher = equal-or-stacked, container-relative, one line of maths, no breakpoint.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 4, "title": "The whole screen \u2014 every primitive at once", "teach": "Read the class attributes top to bottom. That is where the layout lives now; the CSS pane below is empty on purpose.", "html": "<div class=\"stack\"><div class=\"between box\"><strong>Dashboard<\/strong><div class=\"cluster\"><input class=\"input\" style=\"width:auto\" placeholder=\"Search\u2026\"><button class=\"btn\" data-v=\"primary\">New<\/button><\/div><\/div><div class=\"sidebar\"><div class=\"box stack\"><strong>Filters<\/strong><p class=\"muted\" style=\"margin:0\">Status<\/p><p class=\"muted\" style=\"margin:0\">Owner<\/p><\/div><div class=\"grid-auto\"><div class=\"box stack\"><p class=\"muted\" style=\"margin:0;font-size:.8125rem\">Metric 1<\/p><strong style=\"font-size:1.25rem\">1,240<\/strong><\/div><div class=\"box stack\"><p class=\"muted\" style=\"margin:0;font-size:.8125rem\">Metric 2<\/p><strong style=\"font-size:1.25rem\">1,240<\/strong><\/div><div class=\"box stack\"><p class=\"muted\" style=\"margin:0;font-size:.8125rem\">Metric 3<\/p><strong style=\"font-size:1.25rem\">1,240<\/strong><\/div><div class=\"box stack\"><p class=\"muted\" style=\"margin:0;font-size:.8125rem\">Metric 4<\/p><strong style=\"font-size:1.25rem\">1,240<\/strong><\/div><\/div><\/div><\/div>", "base": ":root{--ink:black;--muted:dimgray;--line:gainsboro;--surface:white;--bg:whitesmoke;--brand:steelblue;--s:.5rem;--m:1rem;--l:1.5rem;--xl:2rem;--round:.5rem}\nbody{margin:0;font:1rem/1.5 system-ui;color:var(--ink);background:var(--bg);padding:.5rem}\n.stack > * + *{margin-block-start:var(--space,var(--m))}\n.cluster{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center}\n.between{display:flex;flex-wrap:wrap;gap:var(--m);align-items:center;justify-content:space-between}\n.sidebar{display:flex;flex-wrap:wrap;gap:var(--m)}\n.sidebar > :first-child{flex-basis:var(--side,12rem);flex-grow:1}\n.sidebar > :last-child{flex-basis:0;flex-grow:999;min-inline-size:var(--min,50%)}\n.switcher{display:flex;flex-wrap:wrap;gap:var(--m)}\n.switcher > *{flex-grow:1;flex-basis:calc((var(--threshold,24rem) - 100%) * 999)}\n.grid-auto{display:grid;gap:var(--m);grid-template-columns:repeat(auto-fit,minmax(var(--col,12rem),1fr))}\n.center{margin-inline:auto;max-width:var(--measure,65ch);padding-inline:var(--m)}\n.cover{display:grid;place-items:center;min-block-size:var(--min,14rem)}\n.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--round);padding:var(--m)}\n.btn{padding:.5em 1em;border:1px solid var(--line);border-radius:var(--round);background:var(--surface);font:inherit;cursor:pointer}\n.btn[data-v=primary]{background:var(--brand);border-color:var(--brand);color:white;font-weight:500}\n.input{width:100%;padding:.5em .75em;border:1px solid var(--line);border-radius:var(--round);font:inherit}\n.muted{color:var(--muted)}\n", "css": "/* Empty. This entire screen needs no component CSS. */\n", "task": "Add <code>:root{--m:1.5rem}<\/code> and watch the whole page re-space from one edit.", "key": "Five words carried an entire dashboard: stack \u00b7 cluster \u00b7 between \u00b7 sidebar \u00b7 grid-auto.", "polish": false, "why": "", "isjsx": false, "jsx": ""}, {"stage": 25, "title": "JSX is not HTML \u2014 it is JavaScript that returns elements", "teach": "Everything inside <code>return ( \u2026 )<\/code> is compiled to function calls. That is why it obeys JS rules, not HTML rules: <b>one root element<\/b>, every tag closed, and <code>{ }<\/code> drops you back into JavaScript.", "jsx": "import React from 'react';\n\nexport default function App() {\n  return (\n    <div className=\"box\">\n      <h3>Hello<\/h3>\n      <p className=\"muted\">JSX compiles to function calls.<\/p>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Delete the wrapping <code>&lt;div&gt;<\/code> so there are two roots. Read the error \u2014 'must have one parent element'. Then put it back.", "key": "One root. Every tag closed. { } is an escape hatch back into JavaScript.", "polish": false, "isjsx": true}, {"stage": 25, "title": "className, not class \u2014 and why", "teach": "<code>class<\/code> is a reserved word in JavaScript, so JSX uses <code>className<\/code>. Same for <code>for<\/code> \u2192 <code>htmlFor<\/code>. Everything else (<code>id<\/code>, <code>data-*<\/code>, <code>aria-*<\/code>) keeps its HTML name exactly.", "jsx": "import React from 'react';\n\nexport default function App() {\n  return (\n    <div className=\"box stack\">\n      <label htmlFor=\"email\">Email<\/label>\n      <input id=\"email\" className=\"input\" type=\"email\" aria-describedby=\"hint\" />\n      <p id=\"hint\" className=\"muted\">data-* and aria-* stay unchanged.<\/p>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Change <code>className<\/code> to <code>class<\/code> and watch the styling break. Note the self-closing <code>&lt;input /&gt;<\/code> \u2014 JSX requires the slash.", "key": "className and htmlFor are the only two renames. Void elements MUST self-close: <input />, <img />, <br />.", "polish": false, "isjsx": true}, {"stage": 25, "title": "Composing classes \u2014 this is where your layout lives", "teach": "You already own these. In JSX they go in <code>className<\/code>, space-separated, and they compose: <code>\"box stack\"<\/code> means a bordered card whose children are vertically spaced.", "jsx": "import React from 'react';\n\nexport default function App() {\n  return (\n    <div className=\"stack\">\n      <div className=\"between box\">\n        <strong>Team<\/strong>\n        <button className=\"btn\" data-v=\"primary\">Invite<\/button>\n      <\/div>\n\n      <div className=\"sidebar\">\n        <div className=\"box\">Filters<\/div>\n        <div className=\"grid-auto\">\n          <div className=\"box\">One<\/div>\n          <div className=\"box\">Two<\/div>\n          <div className=\"box\">Three<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Read each className aloud: <code>stack<\/code> = vertical rhythm \u00b7 <code>between<\/code> = pushed apart \u00b7 <code>box<\/code> = card \u00b7 <code>sidebar<\/code> = self-collapsing two-column \u00b7 <code>grid-auto<\/code> = responsive cards. Now drag the preview narrow.", "key": "stack \u00b7 cluster \u00b7 between \u00b7 sidebar \u00b7 switcher \u00b7 center \u00b7 grid-auto \u00b7 box. Layout lives in className, not in new CSS.", "polish": false, "isjsx": true}, {"stage": 25, "title": "style={{ }} \u2014 the double brace, explained", "teach": "The outer <code>{ }<\/code> means 'JavaScript here'. The inner <code>{ }<\/code> is an object literal. So it is not special syntax \u2014 it is an object inside an expression slot. Properties are <b>camelCase<\/b> and numbers are treated as px.", "jsx": "import React from 'react';\n\nexport default function App() {\n  return (\n    <div className=\"box\" style={{ maxWidth: '30rem' }}>\n      <h3 style={{ marginTop: 0, fontSize: '1.25rem' }}>Inline styles<\/h3>\n      <p className=\"muted\" style={{ marginBottom: 0 }}>\n        backgroundColor, not background-color.\n      <\/p>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Add <code>borderLeft: '.25rem solid steelblue'<\/code> to the outer div. Then try <code>background-color<\/code> and see it silently do nothing.", "key": "Outer brace = expression. Inner brace = object. camelCase keys. Use it for one-off values only \u2014 real styling belongs in CSS.", "polish": false, "isjsx": true}, {"stage": 25, "title": ".map() \u2014 rendering a list", "teach": "A list is an array transformed into elements. <code>{ }<\/code> to enter JS, <code>.map()<\/code> to transform, and each item needs a <b>stable<\/b> <code>key<\/code> \u2014 the identity React uses to match elements across renders. Never the array index for a list that can reorder or delete.", "jsx": "import React from 'react';\n\nexport default function App() {\n  const people = [\n    { id: 'a1', name: 'Asha', role: 'Design' },\n    { id: 'b2', name: 'Ravi', role: 'Engineering' },\n    { id: 'c3', name: 'Meera', role: 'Product' },\n  ];\n\n  return (\n    <ul className=\"stack\" style={{ listStyle: 'none', padding: 0, margin: 0 }}>\n      {people.map(p => (\n        <li className=\"between box\" key={p.id}>\n          <div>\n            <strong>{p.name}<\/strong>\n            <p className=\"muted\" style={{ margin: 0, fontSize: '.875rem' }}>{p.role}<\/p>\n          <\/div>\n          <button className=\"btn\">Message<\/button>\n        <\/li>\n      ))}\n    <\/ul>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Add a fourth person. Then change <code>key={p.id}<\/code> to <code>key={i}<\/code> (add <code>, i<\/code> to the map params) \u2014 it still renders, which is exactly why the bug is so easy to ship.", "key": "map returns an array of elements. key must be stable and unique \u2014 an id, never the index for a mutable list.", "polish": false, "isjsx": true}, {"stage": 25, "title": "Conditional rendering \u2014 && and the ternary", "teach": "<code>{cond && <X/>}<\/code> renders X only when cond is truthy. <code>{cond ? <A/> : <B/>}<\/code> picks one. <b>The trap:<\/b> if cond is a <b>number<\/b> and it is 0, React prints the 0. Always coerce to a real boolean.", "jsx": "import React from 'react';\n\nexport default function App() {\n  const items = [];\n  const loading = false;\n\n  return (\n    <div className=\"stack\">\n      {loading && <div className=\"box\">Loading\u2026<\/div>}\n\n      {items.length > 0\n        ? <div className=\"box\">{items.length} results<\/div>\n        : <div className=\"box muted\">No results yet.<\/div>}\n\n      <div className=\"box\">items.length && \u2026 would print: {items.length && 'never seen'}<\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Look at the last box \u2014 it prints <b>0<\/b>, not an empty space. That is the falsy-zero bleed. Fix it with <code>items.length > 0 &&<\/code>.", "key": "&& with a NUMBER prints 0. Always `.length > 0 &&`. This is a top-5 MCQ trap and a real production bug.", "polish": false, "isjsx": true}, {"stage": 25, "title": "Fragments \u2014 grouping without a wrapper div", "teach": "When you need one root but do not want an extra element in the DOM (it would break a grid or flex parent), use a fragment: <code>&lt;&gt; \u2026 &lt;/&gt;<\/code>.", "jsx": "import React from 'react';\n\nexport default function App() {\n  const Row = () => (\n    <>\n      <div className=\"box\">A<\/div>\n      <div className=\"box\">B<\/div>\n    <\/>\n  );\n\n  return (\n    <div className=\"cluster\">\n      <Row />\n      <div className=\"box\">C<\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Replace <code>&lt;&gt;\u2026&lt;/&gt;<\/code> with a <code>&lt;div&gt;<\/code> and watch the cluster break \u2014 the wrapper becomes one flex item instead of two.", "key": "Fragments group without adding a DOM node. Essential inside flex and grid parents.", "polish": false, "isjsx": true}, {"stage": 25, "title": "Putting it together \u2014 a real screen, no new CSS", "teach": "Everything here is composed from classes you already have. Read it as: shell \u2192 bar \u2192 sidebar \u2192 grid \u2192 list. That is the whole job.", "jsx": "import React from 'react';\n\nexport default function App() {\n  const metrics = ['Revenue', 'Active users', 'Churn', 'NPS'];\n  const rows = [\n    { id: 1, name: 'Acme Corp', status: 'Active' },\n    { id: 2, name: 'Globex', status: 'Trial' },\n  ];\n\n  return (\n    <div className=\"stack\">\n      <div className=\"between box\">\n        <strong style={{ fontSize: '1.125rem' }}>Dashboard<\/strong>\n        <div className=\"cluster\">\n          <input className=\"input\" style={{ width: 'auto' }} placeholder=\"Search\u2026\" />\n          <button className=\"btn\" data-v=\"primary\">New<\/button>\n        <\/div>\n      <\/div>\n\n      <div className=\"sidebar\">\n        <div className=\"box stack\">\n          <strong>Filters<\/strong>\n          {['Status', 'Owner', 'Region'].map(f => (\n            <p className=\"muted\" style={{ margin: 0 }} key={f}>{f}<\/p>\n          ))}\n        <\/div>\n\n        <div className=\"stack\">\n          <div className=\"grid-auto\">\n            {metrics.map(m => (\n              <div className=\"box stack\" key={m}>\n                <p className=\"muted\" style={{ margin: 0, fontSize: '.8125rem' }}>{m}<\/p>\n                <strong style={{ fontSize: '1.25rem' }}>1,240<\/strong>\n              <\/div>\n            ))}\n          <\/div>\n\n          <ul className=\"stack\" style={{ listStyle: 'none', padding: 0, margin: 0 }}>\n            {rows.map(r => (\n              <li className=\"between box\" key={r.id}>\n                <strong>{r.name}<\/strong>\n                <span className=\"muted\">{r.status}<\/span>\n              <\/li>\n            ))}\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Change nothing first \u2014 drag the preview from wide to narrow and watch the sidebar and grid respond independently. Then add a fifth metric.", "key": "Zero component CSS. Layout in className, data in .map(), structure in the return block. That is a machine-coding round.", "polish": false, "isjsx": true}, {"stage": 26, "title": "useState \u2014 the whole model in four lines", "teach": "<code>const [value, setValue] = useState(initial)<\/code>. Calling <code>setValue<\/code> does two things: it stores the new value <b>and<\/b> asks React to run your component again. The screen is a function of state \u2014 you never touch the DOM.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n\n  return (\n    <div className=\"box cluster\">\n      <button className=\"btn\" onClick={() => setCount(count - 1)}>\u2212<\/button>\n      <strong style={{ minWidth: '3ch', textAlign: 'center' }}>{count}<\/strong>\n      <button className=\"btn\" data-v=\"primary\" onClick={() => setCount(count + 1)}>+<\/button>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Add a Reset button that calls <code>setCount(0)<\/code>. Then try changing <code>count<\/code> directly with <code>count = 5<\/code> \u2014 nothing happens, because that does not tell React to re-render.", "key": "State = memory + a re-render request. Never mutate state directly; always call the setter.", "polish": false, "isjsx": true}, {"stage": 26, "title": "The functional updater \u2014 and why two clicks can equal one", "teach": "<code>setCount(count + 1)<\/code> reads <code>count<\/code> from <b>this<\/b> render's closure. Call it twice in one handler and both read the same stale value, so you get +1 not +2. <code>setCount(c => c + 1)<\/code> receives the latest value instead.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n\n  const brokenTwice = () => { setCount(count + 1); setCount(count + 1); };\n  const worksTwice  = () => { setCount(c => c + 1); setCount(c => c + 1); };\n\n  return (\n    <div className=\"box stack\">\n      <strong style={{ fontSize: '1.5rem' }}>{count}<\/strong>\n      <div className=\"cluster\">\n        <button className=\"btn\" onClick={brokenTwice}>+2 (broken)<\/button>\n        <button className=\"btn\" data-v=\"primary\" onClick={worksTwice}>+2 (correct)<\/button>\n      <\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Click each button and watch the difference. This exact snippet is a top-5 MCQ trap and a real production bug.", "key": "Two setState calls that read the current value both see the SAME value. Use the updater form whenever the next value depends on the previous one.", "polish": false, "isjsx": true}, {"stage": 26, "title": "Controlled inputs \u2014 the value comes from state", "teach": "A controlled input has <code>value={state}<\/code> and <code>onChange<\/code> writing back. React owns the value; the DOM just displays it. That is why you can transform, validate or block input on the way through.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [name, setName] = useState('');\n\n  return (\n    <div className=\"box stack\" style={{ maxWidth: '24rem' }}>\n      <label htmlFor=\"n\">Your name<\/label>\n      <input id=\"n\" className=\"input\" value={name}\n             onChange={e => setName(e.target.value)} />\n      <p className=\"muted\" style={{ margin: 0 }}>\n        {name.length} characters\n      <\/p>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Make it uppercase on the way in: <code>setName(e.target.value.toUpperCase())<\/code>. Then remove <code>onChange<\/code> entirely \u2014 the input freezes, because state never changes.", "key": "value + onChange = controlled. Remove onChange and the field becomes read-only \u2014 a classic 'why can't I type' bug.", "polish": false, "isjsx": true}, {"stage": 26, "title": "Derived state \u2014 compute during render, never store it", "teach": "If a value can be calculated from existing state, <b>calculate it<\/b>. Storing it in a second <code>useState<\/code> means two sources of truth that drift apart. This is the single most common architecture mistake in React.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [items] = useState([\n    { id: 1, label: 'Design review', done: true },\n    { id: 2, label: 'Ship the build', done: false },\n    { id: 3, label: 'Write tests', done: false },\n  ]);\n  const [query, setQuery] = useState('');\n\n  // derived \u2014 no extra state\n  const shown = items.filter(i => i.label.toLowerCase().includes(query.toLowerCase()));\n  const remaining = items.filter(i => !i.done).length;\n\n  return (\n    <div className=\"stack\" style={{ maxWidth: '26rem' }}>\n      <input className=\"input\" placeholder=\"Filter\u2026\" value={query}\n             onChange={e => setQuery(e.target.value)} />\n      <p className=\"muted\" style={{ margin: 0 }}>{remaining} remaining<\/p>\n      <ul className=\"stack\" style={{ listStyle: 'none', padding: 0, margin: 0 }}>\n        {shown.map(i => <li className=\"box\" key={i.id}>{i.label}<\/li>)}\n      <\/ul>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Note there is no <code>useState<\/code> for <code>shown<\/code> or <code>remaining<\/code>. Try adding one and keeping it in sync \u2014 you will feel why it is a trap.", "key": "Derive, do not store. Two useStates that must agree will eventually disagree.", "polish": false, "isjsx": true}, {"stage": 26, "title": "Updating arrays immutably \u2014 add, remove, toggle", "teach": "React compares by reference. Mutating an array with <code>push<\/code> keeps the same reference, so React sees no change and skips the re-render. Always produce a <b>new<\/b> array.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [todos, setTodos] = useState([{ id: 1, text: 'First task', done: false }]);\n  const [text, setText] = useState('');\n\n  const add = () => {\n    if (!text.trim()) return;\n    setTodos([...todos, { id: Date.now(), text: text.trim(), done: false }]);\n    setText('');\n  };\n  const remove = id => setTodos(todos.filter(t => t.id !== id));\n  const toggle = id => setTodos(todos.map(t => t.id === id ? { ...t, done: !t.done } : t));\n\n  return (\n    <div className=\"stack\" style={{ maxWidth: '26rem' }}>\n      <div className=\"cluster\">\n        <input className=\"input\" value={text} placeholder=\"New task\"\n               onChange={e => setText(e.target.value)}\n               onKeyDown={e => e.key === 'Enter' && add()} />\n        <button className=\"btn\" data-v=\"primary\" onClick={add}>Add<\/button>\n      <\/div>\n      <ul className=\"stack\" style={{ listStyle: 'none', padding: 0, margin: 0 }}>\n        {todos.map(t => (\n          <li className=\"between box\" key={t.id}>\n            <label className=\"cluster\" style={{ gap: '.5rem' }}>\n              <input type=\"checkbox\" checked={t.done} onChange={() => toggle(t.id)} />\n              <span style={{ textDecoration: t.done ? 'line-through' : 'none' }}>{t.text}<\/span>\n            <\/label>\n            <button className=\"btn\" onClick={() => remove(t.id)}>Delete<\/button>\n          <\/li>\n        ))}\n      <\/ul>\n      {todos.length === 0 && <p className=\"muted\">Nothing left. Add a task.<\/p>}\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Replace <code>setTodos([...todos, \u2026])<\/code> with <code>todos.push(\u2026); setTodos(todos)<\/code> \u2014 the item is added to the array but the screen never updates. That is the reference bug, live.", "key": "add = [...xs, n] \u00b7 remove = xs.filter() \u00b7 toggle = xs.map(). Three lines cover every list CRUD you will be asked for.", "polish": false, "isjsx": true}, {"stage": 26, "title": "useEffect \u2014 for things outside React, with cleanup", "teach": "Effects are for the outside world: timers, subscriptions, network. The <b>return<\/b> is the cleanup and it runs before the next effect and on unmount. A timer without cleanup is a memory leak and a doubled interval.", "jsx": "import React, { useState, useEffect } from 'react';\n\nexport default function App() {\n  const [secs, setSecs] = useState(0);\n  const [running, setRunning] = useState(false);\n\n  useEffect(() => {\n    if (!running) return;\n    const id = setInterval(() => setSecs(s => s + 1), 1000);\n    return () => clearInterval(id);      // \u2190 the cleanup\n  }, [running]);\n\n  return (\n    <div className=\"box stack\" style={{ maxWidth: '18rem' }}>\n      <strong style={{ fontSize: '2rem' }}>{secs}s<\/strong>\n      <div className=\"cluster\">\n        <button className=\"btn\" data-v=\"primary\" onClick={() => setRunning(r => !r)}>\n          {running ? 'Stop' : 'Start'}\n        <\/button>\n        <button className=\"btn\" onClick={() => { setRunning(false); setSecs(0); }}>Reset<\/button>\n      <\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Delete the <code>return () => clearInterval(id)<\/code> line, then start and stop a few times \u2014 the counter accelerates because old intervals never died.", "key": "Every subscription needs a cleanup. Note setSecs(s => s+1) \u2014 without the updater this would freeze at 1 (stale closure).", "polish": false, "isjsx": true}, {"stage": 26, "title": "Lifting state \u2014 two components, one source of truth", "teach": "When two parts of the UI need the same value, the state moves <b>up<\/b> to their closest common parent and comes back down as props. Callbacks go down too, so children can ask the parent to change it.", "jsx": "import React, { useState } from 'react';\n\nfunction Chip({ label, active, onPick }) {\n  return (\n    <button className=\"btn\" data-v={active ? 'primary' : undefined}\n            onClick={() => onPick(label)}>{label}<\/button>\n  );\n}\n\nexport default function App() {\n  const [filter, setFilter] = useState('All');\n  const tabs = ['All', 'Active', 'Done'];\n\n  return (\n    <div className=\"stack\" style={{ maxWidth: '26rem' }}>\n      <div className=\"cluster\">\n        {tabs.map(t => (\n          <Chip key={t} label={t} active={filter === t} onPick={setFilter} />\n        ))}\n      <\/div>\n      <div className=\"box\">Showing: <strong>{filter}<\/strong><\/div>\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "The Chip has no state at all \u2014 it receives <code>active<\/code> and calls <code>onPick<\/code>. Add a fourth tab and it just works.", "key": "State up, props down, callbacks up. Dumb children, one owner. This is the answer to 'how do you share state?'", "polish": false, "isjsx": true}, {"stage": 26, "title": "A complete feature \u2014 everything at once", "teach": "Search + filter + add + toggle + delete + empty state + count. This is a Tier-S machine-coding task, fully functional, in one screen.", "jsx": "import React, { useState } from 'react';\n\nexport default function App() {\n  const [todos, setTodos] = useState([\n    { id: 1, text: 'Read the brief', done: true },\n    { id: 2, text: 'Build the layout', done: false },\n  ]);\n  const [text, setText] = useState('');\n  const [query, setQuery] = useState('');\n  const [tab, setTab] = useState('All');\n\n  const shown = todos\n    .filter(t => tab === 'All' || (tab === 'Done') === t.done)\n    .filter(t => t.text.toLowerCase().includes(query.toLowerCase()));\n\n  const add = () => {\n    const v = text.trim();\n    if (!v) return;\n    setTodos(ts => [...ts, { id: Date.now(), text: v, done: false }]);\n    setText('');\n  };\n\n  return (\n    <div className=\"stack\" style={{ maxWidth: '30rem' }}>\n      <div className=\"between box\">\n        <strong>Tasks<\/strong>\n        <span className=\"muted\">{todos.filter(t => !t.done).length} left<\/span>\n      <\/div>\n\n      <div className=\"cluster\">\n        <input className=\"input\" style={{ flex: 1 }} value={text} placeholder=\"New task\"\n               onChange={e => setText(e.target.value)}\n               onKeyDown={e => e.key === 'Enter' && add()} />\n        <button className=\"btn\" data-v=\"primary\" onClick={add}>Add<\/button>\n      <\/div>\n\n      <input className=\"input\" value={query} placeholder=\"Search\u2026\"\n             onChange={e => setQuery(e.target.value)} />\n\n      <div className=\"cluster\">\n        {['All', 'Active', 'Done'].map(t => (\n          <button key={t} className=\"btn\" data-v={tab === t ? 'primary' : undefined}\n                  onClick={() => setTab(t)}>{t}<\/button>\n        ))}\n      <\/div>\n\n      <ul className=\"stack\" style={{ listStyle: 'none', padding: 0, margin: 0 }}>\n        {shown.map(t => (\n          <li className=\"between box\" key={t.id}>\n            <label className=\"cluster\" style={{ gap: '.5rem' }}>\n              <input type=\"checkbox\" checked={t.done}\n                     onChange={() => setTodos(ts => ts.map(x => x.id === t.id ? { ...x, done: !x.done } : x))} />\n              <span style={{ textDecoration: t.done ? 'line-through' : 'none' }}>{t.text}<\/span>\n            <\/label>\n            <button className=\"btn\" onClick={() => setTodos(ts => ts.filter(x => x.id !== t.id))}>Delete<\/button>\n          <\/li>\n        ))}\n      <\/ul>\n\n      {shown.length === 0 && <p className=\"muted\">No tasks match.<\/p>}\n    <\/div>\n  );\n}\n", "css": "", "html": "", "base": "", "task": "Everything works. Now count the state: four <code>useState<\/code> calls, zero derived values stored. That ratio is what an interviewer is reading.", "key": "Minimal state, everything else derived. Four hooks carried a full CRUD feature with search, filters and an empty state.", "polish": false, "isjsx": true}], "challenges": [["Notification centre", "Panel with a heading and a 'Mark all read' button on one line, then a scrollable list. Each row: title + timestamp left, coloured badge + dismiss button right. Panel is fixed height; only the list scrolls.", ["action bar", "data list", "overflow"]], ["Pricing page", "Three plan cards side by side on desktop, stacked on mobile, NO media query. Each card: name, big price, feature list, CTA pinned to the bottom regardless of feature count.", ["responsive grid", "flex column + space-between"]], ["Settings screen", "Sidebar of section links left, form right. Under 640px the sidebar becomes a horizontal strip above the form. Stacked fields with labels, one showing an inline error.", ["app shell", "media query", "form"]], ["Empty search results", "Search bar at the top. Below it a centred empty state with an icon block, a message naming the query, and a 'Clear search' button.", ["action bar", "centred box", "state triad"]], ["Gallery + lightbox", "Responsive thumbnail grid. Clicking one opens a full-screen dim overlay with the image centred and a close button top-right. Layout only.", ["responsive grid", "overlay", "absolute"]]], "appcss": "/* \u2550\u2550\u2550 app.css \u2014 ~36 lines, typed once. Named colours only: nothing to look up. \u2550\u2550\u2550 */\n\n/* 1 \u00b7 TOKENS \u2014 every value is a CSS keyword you can spell from memory */\n:root{\n  --ink:    black;          /* body text            */\n  --muted:  dimgray;        /* secondary text       */\n  --line:   gainsboro;      /* hairline borders     */\n  --surface:white;          /* cards, inputs        */\n  --bg:     whitesmoke;     /* page background      */\n  --brand:  steelblue;      /* primary action       */\n  --ok:     seagreen;       /* success              */\n  --warn:   goldenrod;      /* warning              */\n  --danger: firebrick;      /* destructive / errors */\n\n  --s:.5rem; --m:1rem; --l:1.5rem; --xl:2rem; --round:8px;\n}\n/* Need a hover or a tint? DERIVE it, never add a token:\n   hover \u2192 color-mix(in oklch, var(--brand) 85%, black)\n   tint  \u2192 color-mix(in oklch, var(--brand) 10%, var(--surface)) */\n\n/* 2 \u00b7 RESET */\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);b round:color-mix(in oklch,var(--brand) 85%,black)}\n.btn[data-v=ghost]{background:none;border-color:transparent}\n[data-tone=danger]{color:var(--danger);border-color:var(--danger)}\n[data-tone=ok]{color:var(--ok);border-color:var(--ok)}\n"};

function fmt(css){
  let out='',ind=0,i=0,inC=false;
  css=css.replace(/\s+/g,' ').replace(/\s*([{};,])\s*/g,'$1');
  while(i<css.length){
    const c=css[i];
    if(css.startsWith('/*',i)){const e=css.indexOf('*/',i)+2;out+='  '.repeat(ind)+css.slice(i,e)+'\n';i=e;continue;}
    if(c==='{'){out=out.trimEnd()+' {\n';ind++;i++;continue;}
    if(c==='}'){ind=Math.max(0,ind-1);out=out.trimEnd()+'\n'+'  '.repeat(ind)+'}\n';i++;continue;}
    if(c===';'){out+=';\n';i++;continue;}
    if(out.endsWith('\n')||out==='')out+='  '.repeat(ind);
    out+=c;i++;
  }
  return out.replace(/\n{3,}/g,'\n\n').replace(/}\n(?!\n|$)/g,'}\n\n').trim()+'\n';
}

 '1':'<h3>Stage 1 · Atoms</h3><p>One property at a time, in isolation. Read the idea, do the small task, watch the preview change. Do not memorise anything yet — just make each one <em>make sense</em>. ~45 min.</p>',
 '2':'<h3>Stage 2 · The System</h3><p>Stop writing CSS per component. Type <b>app.css</b> once — nine colours, four spaces, ~40 lines — and most components then need <b>zero new CSS</b>.</p><p style="margin-top:.5rem"><b>The rule everything hangs on: Grid when the PARENT decides the tracks, Flex when the CONTENT decides.</b> Grid is 2D and top-down; Flex is one direction and content-driven. Reaching for a third nested container to fake alignment means you needed Grid one level up.</p><p style="margin-top:.5rem">Grid: <b>stack · cover · grid · switcher · sidebar · shell</b>. Flex: <b>cluster · between</b>. Flex is kept only where flex is genuinely right — a wrapping row whose count you do not control.</p><p style="margin-top:.6rem;background:#fffbeb;border-left:3px solid goldenrod;padding:.55rem .7rem;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#78350f"><b>Calibration for your exam.</b> Mettl\'s CSS3 competency list names <i>Flexbox, responsive design, layout, backgrounds, text</i>. Core here is <b>flex + grid + the decision rule</b> — that is what is actually tested, and it is the reasoning behind most layout MCQs. The two <b>BONUS</b> lessons (subgrid, container queries) are interview garnish: know what each solves, say one sentence, move on. Every primitive in app.css works without them, so nothing silently breaks if you skip them under time pressure.</p>',
 '3':'<h3>Stage 3 · Polish</h3><p>The other half of looking good — and it is almost no code. Flip <b>Polish ON/OFF</b>: the preview <em>and</em> the CSS both change, with every altered line highlighted (<span style="background:#dcfce7;padding:0 4px;border-radius:3px">+ added</span> / <span style="background:#fee2e2;padding:0 4px;border-radius:3px">− replaced</span>). These are habits, not knowledge — after a few passes your hands do them for you.</p>',
 '35':'<h3>Stage 4 · Responsive &amp; Units</h3><p>When to reach for <b>rem</b>, <b>em</b>, <b>ch</b>, <b>dvh</b> and <b>clamp()</b> — and the places <b>px</b> is still correct. Each lesson toggles between the px version and the relative version with the changed lines highlighted. The one-line rule: <em>type and space in rem · component padding in em · line length in ch · full height in dvh · fluid type in clamp() with rem bounds · hairlines and shadows stay px</em>.</p>',
